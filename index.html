    const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext, Fragment } = React;

    /* ===================== DATA ===================== */
// NOTE: All schedule, seat and fare data below is clearly-labelled DEMO data.
// No real railway availability API is connected. The UI always shows a
// "Demo data" badge and an explicit verification status. When a real backend
// + railway availability API is wired in, only the data layer below changes.

const DATA_VERSION = "demo-v1.0";
const AVAILABILITY_SOURCE = "Demo dataset (simulated schedule & seat availability)";

const CLASSES = [
  { code: "SL", label: "Sleeper (SL)" },
  { code: "3A", label: "AC 3 Tier (3A)" },
  { code: "2A", label: "AC 2 Tier (2A)" },
  { code: "1A", label: "AC First (1A)" },
  { code: "CC", label: "AC Chair Car (CC)" },
  { code: "2S", label: "Second Sitting (2S)" },
];

const FARE = {
  base: { "2S": 15, SL: 35, CC: 50, "3A": 75, "2A": 100, "1A": 150 },
  rate: { "2S": 0.40, SL: 0.65, CC: 1.05, "3A": 1.75, "2A": 2.30, "1A": 3.10 },
};
function computeFare(cls, dist) {
  return Math.round((FARE.base[cls] || 30) + dist * (FARE.rate[cls] || 0.6));
}

const STATIONS = [
  { code: "MYS", name: "Mysuru Junction",      city: "Mysuru",      state: "Karnataka" },
  { code: "MYA", name: "Mandya",               city: "Mandya",      state: "Karnataka" },
  { code: "SBC", name: "KSR Bengaluru",        city: "Bengaluru",   state: "Karnataka" },
  { code: "YPR", name: "Yesvantpur Jn",        city: "Bengaluru",   state: "Karnataka" },
  { code: "TK",  name: "Tumakuru",             city: "Tumakuru",    state: "Karnataka" },
  { code: "ASK", name: "Arsikere Jn",          city: "Arsikere",    state: "Karnataka" },
  { code: "HAS", name: "Hassan",               city: "Hassan",      state: "Karnataka" },
  { code: "SMET",name: "Shivamogga Town",      city: "Shivamogga",  state: "Karnataka" },
  { code: "SAG", name: "Sagara Jambagaravalli",city: "Sagara",      state: "Karnataka" },
  { code: "DVG", name: "Davangere",            city: "Davangere",   state: "Karnataka" },
  { code: "HRR", name: "Haveri",               city: "Haveri",      state: "Karnataka" },
  { code: "UBL", name: "Hubballi Jn",          city: "Hubballi",    state: "Karnataka" },
  { code: "GD",  name: "Gadag Jn",             city: "Gadag",       state: "Karnataka" },
  { code: "BGK", name: "Bagalkot",             city: "Bagalkot",    state: "Karnataka" },
  { code: "DWR", name: "Dharwad",              city: "Dharwad",     state: "Karnataka" },
  { code: "BGM", name: "Belagavi",             city: "Belagavi",    state: "Karnataka" },
  { code: "MAO", name: "Madgaon",              city: "Madgaon",     state: "Goa" },
  { code: "PVR", name: "Pernem",               city: "Pernem",      state: "Goa" },
  { code: "PUNE",name: "Pune Jn",              city: "Pune",        state: "Maharashtra" },
  { code: "CSMT",name: "Mumbai CSMT",          city: "Mumbai",      state: "Maharashtra" },
  { code: "MMCT",name: "Mumbai Central",       city: "Mumbai",      state: "Maharashtra" },
  { code: "LTT", name: "Lokmanya Tilak (T)",   city: "Mumbai",      state: "Maharashtra" },
  { code: "NDLS",name: "New Delhi",            city: "Delhi",       state: "Delhi" },
  { code: "NZM", name: "Hazrat Nizamuddin",    city: "Delhi",       state: "Delhi" },
  { code: "MAS", name: "MGR Chennai Central",  city: "Chennai",     state: "Tamil Nadu" },
  { code: "SC",  name: "Secunderabad Jn",      city: "Hyderabad",   state: "Telangana" },
  { code: "HYB", name: "Hyderabad Deccan",     city: "Hyderabad",   state: "Telangana" },
  { code: "HWH", name: "Howrah Jn",            city: "Kolkata",     state: "West Bengal" },
  { code: "ADI", name: "Ahmedabad Jn",         city: "Ahmedabad",   state: "Gujarat" },
  { code: "JP",  name: "Jaipur Jn",            city: "Jaipur",      state: "Rajasthan" },
  { code: "BPL", name: "Bhopal Jn",            city: "Bhopal",      state: "Madhya Pradesh" },
  { code: "CNB", name: "Kanpur Central",       city: "Kanpur",      state: "Uttar Pradesh" },
  { code: "LKO", name: "Lucknow Charbagh",     city: "Lucknow",     state: "Uttar Pradesh" },
  { code: "NGP", name: "Nagpur Jn",            city: "Nagpur",      state: "Maharashtra" },
  { code: "ERS", name: "Ernakulam Jn",         city: "Kochi",       state: "Kerala" },
  { code: "SMVB",name: "SMVT Bengaluru",       city: "Bengaluru",   state: "Karnataka" },
  { code: "MAQ", name: "Mangaluru Central",    city: "Mangaluru",   state: "Karnataka" },
];
const STATION_MAP = Object.fromEntries(STATIONS.map(s => [s.code, s]));
const getStation = (code) => {
  if (!code) return { code: "", name: "Unknown", city: "Unknown", state: "" };
  if (STATION_MAP[code]) return STATION_MAP[code];
  return { code: code, name: code, city: code, state: "" };
};
function stationSearch(q) {
  const k = q.trim().toLowerCase();
  if (!k) return STATIONS.slice(0, 8);
  return STATIONS.filter(s =>
    s.name.toLowerCase().includes(k) ||
    s.city.toLowerCase().includes(k) ||
    s.code.toLowerCase().includes(k) ||
    s.state.toLowerCase().includes(k)
  ).slice(0, 8);
}

// Expand a compact per-class availability spec into per-consecutive-segment records.
// spec.pattern: 'all' | 'grouped' | 'mixed'
//   'all'     -> every segment available with one seat
//   'grouped' -> segments grouped into seat-cohorts; cohorts => seat-change points
//   'mixed'   -> some cohorts available, 'waitlist' intervals block full rides
function expandAvail(stops, spec) {
  const idx = {}; stops.forEach((s, i) => (idx[s.code] = i));
  const out = [];
  for (let i = 0; i < stops.length - 1; i++) {
    const from = stops[i].code, to = stops[i + 1].code;
    let rec = { from, to, status: "unavailable", seat: null, coach: null };
    if (spec.pattern === "all" && spec.seat) {
      const [coach, seat] = spec.seat.split("-");
      rec = { from, to, status: "available", seat, coach };
    } else {
      const groups = spec.groups || [];
      const wl = spec.waitlist || [];
      const gi = groups.findIndex(g => idx[g[0]] <= i && idx[g[1]] >= i + 1);
      const wi = wl.findIndex(g => idx[g[0]] <= i && idx[g[1]] >= i + 1);
      if (gi >= 0) {
        const seatStr = (spec.seats && spec.seats[gi]) || spec.seat || "S?-00";
        const [coach, seat] = seatStr.split("-");
        rec = { from, to, status: "available", seat, coach };
      } else if (wi >= 0) {
        rec = { from, to, status: "waitlist", seat: null, coach: null };
      }
    }
    out.push(rec);
  }
  return out;
}

function buildTrain(spec) {
  const stops = spec.stops.map(s => ({ code: s.s, a: s.a, d: s.d, plat: s.p, km: s.km }));
  const dists = [];
  for (let i = 0; i < stops.length - 1; i++) dists.push(Math.max(0, stops[i + 1].km - stops[i].km));
  const segments = {};
  spec.classes.forEach(cls => {
    const sp = spec.avail[cls];
    const recs = sp ? expandAvail(stops, sp) : stops.slice(0, -1).map(() => ({ status: "unavailable", seat: null, coach: null }));
    segments[cls] = recs.map((r, i) => ({
      from: stops[i].code, to: stops[i + 1].code, dist: dists[i],
      status: r.status, seat: r.seat, coach: r.coach, fare: computeFare(cls, dists[i]),
    }));
  });
  return { number: spec.number, name: spec.name, type: spec.type, classes: spec.classes, days: spec.days, stops, segments };
}

// ---- Train definitions ----------------------------------------------------
// T1 echoes the brief's example: Mysuru -> Arsikere -> Dharwad -> Belagavi on
// one train with seat changes at Arsikere and Dharwad.
const TRAINS = [
  buildTrain({
    number: "16535", name: "Karnataka Express", type: "Express", classes: ["SL", "3A", "2A"], days: "Daily",
    stops: [
      { s: "MYS", a: null, d: "08:00", p: 1, km: 0 },
      { s: "MYA", a: "08:22", d: "08:24", p: 1, km: 24 },

// Build all confirmed single-train rides for a class.
// A ride (fromStop -> toStop) is valid only when EVERY consecutive sub-segment
// between them has confirmed availability in that class.
function buildRides(cls) {
  const rides = [];
  TRAINS.forEach((train) => {
    const segs = train.segments[cls];
    if (!segs) return;
    const stops = train.stops;
    for (let i = 0; i < stops.length - 1; i++) {
      for (let j = i + 1; j < stops.length; j++) {
        let ok = true;
        for (let k = i; k < j; k++) { if (!segs[k] || segs[k].status !== "available") { ok = false; break; } }
        if (!ok) continue;
        rides.push({ train, fromIdx: i, toIdx: j, fromStation: stops[i].code, toStation: stops[j].code, cls, segs });
      }
    }
  });
  return rides;
}

// Resolve absolute times for a ride, honouring a minimum departure (for connections)
// and rolling over midnight so after-midnight arrivals are correct.
function rideDetail(ride, minDepartAbs) {
  const stops = ride.train.stops, segs = ride.segs, fi = ride.fromIdx, ti = ride.toIdx;
  const depTod = timeToMin(stops[fi].d);
  if (depTod == null) return null;
  let dep = depTod;
  if (minDepartAbs != null) { while (dep < minDepartAbs) dep += 1440; }
  const stopTimes = [];
  let prevArr = null, cursor = dep;
  for (let k = fi; k <= ti; k++) {
    const depAbs = (k === ti) ? null : cursor;
    const arrAbs = (k === fi) ? null : prevArr;
    stopTimes.push({ code: stops[k].code, depAbs, arrAbs, plat: stops[k].plat });
    if (k < ti) {
      let arrTod = timeToMin(stops[k + 1].a);
      let arr = arrTod + Math.floor(cursor / 1440) * 1440;
      while (arr < cursor) arr += 1440;
      prevArr = arr;
      if (k + 1 < ti) {
        const ndTod = timeToMin(stops[k + 1].d);
        let nd = ndTod + Math.floor(arr / 1440) * 1440;
        while (nd < arr) nd += 1440;
        cursor = nd;
      }
    }
  }
  const departAbs = dep, arriveAbs = prevArr, duration = arriveAbs - departAbs;
  const dist = stops[ti].km - stops[fi].km;
  // seat-change intervals: maximal runs sharing the same coach+seat
  const intervals = [];
  let i = fi;
  while (i < ti) {
    let j = i;
    while (j + 1 < ti && segs[j].coach === segs[j + 1].coach && segs[j].seat === segs[j + 1].seat) j++;
    const a = i - fi, b = (j + 1) - fi;
    const fare = (() => { let s = 0; for (let k = i; k <= j; k++) s += segs[k].fare; return s; })();
    const d = stops[j + 1].km - stops[i].km;
    intervals.push({
      trainNumber: ride.train.number, trainName: ride.train.name, trainType: ride.train.type,
      from: stops[i].code, to: stops[j + 1].code,
      departAbs: stopTimes[a].depAbs, arriveAbs: stopTimes[b].arrAbs,
      fromPlatform: stopTimes[a].plat, toPlatform: stopTimes[b].plat,
      coach: segs[i].coach, seat: segs[i].seat, fare, dist, duration: stopTimes[b].arrAbs - stopTimes[a].depAbs,
    });
    i = j + 1;
  }
  return { ride, departAbs, arriveAbs, duration, dist, intervals, seatChanges: intervals.length - 1, stopTimes };
}

// Discover every alternative journey from -> to for a class.
// Multi-train connections allowed (default up to 3 trains); same train may not
// be re-boarded (so same-train seat changes stay inside one maximal ride).
function discoverJourneys(fromCode, toCode, cls, opts = {}) {
  if (!fromCode || !toCode || fromCode === toCode) return [];
  const maxTrains = opts.maxTrains ?? 3;
  const minConnect = opts.minConnect ?? 10;
  const maxWait = opts.maxWait ?? 12 * 60;
  const rides = buildRides(cls);
  const outFrom = {};
  rides.forEach((r) => { (outFrom[r.fromStation] ||= []).push(r); });
  const results = [], seen = new Set();

  const finalize = (path) => {
    const key = path.map((p) => `${p.ride.train.number}:${p.ride.fromStation}-${p.ride.toStation}`).join(">");
    if (seen.has(key)) return; seen.add(key);
    const first = path[0], last = path[path.length - 1];
    const departAbs = first.departAbs, arriveAbs = last.arriveAbs;
    const totalDuration = arriveAbs - departAbs;
    const segments = [];
    let trainChanges = 0, seatChanges = 0, prevTrain = null;
    path.forEach((leg, li) => {
      leg.intervals.forEach((iv, ii) => {
        let boundary = null;
        if (segments.length > 0) {
          if (iv.trainNumber !== prevTrain) { boundary = "train"; trainChanges++; }
          else { boundary = "seat"; seatChanges++; }
        }
        segments.push({ ...iv, boundary, legIndex: li });
        prevTrain = iv.trainNumber;
      });
    });
    const totalFare = segments.reduce((s, x) => s + x.fare, 0);
    const totalDist = segments.reduce((s, x) => s + x.dist, 0);
    const connections = [];
    let totalWait = 0;
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i + 1];
      const st = b.ride.fromStation;
      const arrStop = a.ride.train.stops.find((s) => s.code === st);
      const depStop = b.ride.train.stops.find((s) => s.code === st);
      const wait = b.departAbs - a.arriveAbs;
      totalWait += wait;
      connections.push({
        station: st, arriveAbs: a.arriveAbs, departAbs: b.departAbs, wait,
        short: wait < 20, platformFrom: arrStop ? arrStop.plat : null, platformTo: depStop ? depStop.plat : null,
      });
    }
    const changeType = (path.length === 1 && seatChanges === 0) ? "direct"
      : (trainChanges > 0 && seatChanges > 0) ? "combined"
      : (trainChanges > 0) ? "train" : "seat";
    const overnight = Math.floor(arriveAbs / 1440) > Math.floor(departAbs / 1440);
    const score = aiScore({ totalDuration, totalFare, trainChanges, seatChanges, totalWait, overnight, connections });
    results.push({
      key, departAbs, arriveAbs, totalDuration, totalFare, totalDist,
      trainChanges, seatChanges, changeType, overnight, segments, connections,
      legs: path.map((p) => ({ train: p.ride.train, intervals: p.intervals, departAbs: p.departAbs, arriveAbs: p.arriveAbs, duration: p.duration, dist: p.dist, seatChanges: p.seatChanges })),
      totalWait, score,

    if (station === toCode) { if (path.length) finalize(path); return; }
    if (path.length >= maxTrains) return;
    const cand = outFrom[station] || [];
    for (const r of cand) {
      if (path.length && r.train.number === path[path.length - 1].ride.train.number) continue;
      if (visited.has(r.toStation)) continue;
      const minDep = path.length ? prevArrive + minConnect : null;
      const det = rideDetail(r, minDep);
      if (!det) continue;
      if (path.length && det.departAbs - prevArrive > maxWait) continue;
      visited.add(r.toStation);
      path.push(det);
      dfs(r.toStation, path, det.arriveAbs, visited);

  // long journeys, then return the best-ranked subset.
  const bySeq = {};

// AI ranking: lower score = better. Penalises time, price, changes, waits,
// overnight travel and short (risky) transfers.
function aiScore(j) {
  const risk = j.connections.reduce((s, c) => s + (c.short ? 1 : 0), 0);
  const farePenalty = j.totalFare != null ? j.totalFare / 8 : 500;
  return Math.round(
    j.totalDuration +
    farePenalty +
    (j.trainChanges + j.seatChanges) * 45 +
    j.totalWait * 0.6 +

  if (best.minFare != null && j.totalFare === best.minFare) parts.push("lowest total fare");
  if (j.trainChanges + j.seatChanges === best.minChg) parts.push("fewest changes");
  if (j.totalWait === best.minWait) parts.push("shortest waiting time");

function computeBest(journeys) {

  const minDur = Math.min(...journeys.map((j) => j.totalDuration));
  const knownFares = journeys.map((j) => j.totalFare).filter((f) => f != null);
  const minFare = knownFares.length ? Math.min(...knownFares) : null;
  const minChg = Math.min(...journeys.map((j) => j.trainChanges + j.seatChanges));
  const minWait = Math.min(...journeys.map((j) => j.totalWait));
  let best = null, bestScore = Infinity;
  journeys.forEach((j) => { if (j.score < bestScore) { bestScore = j.score; best = j; } });
  return { minDur, minFare, minChg, minWait, best, bestScore };

function applyFilters(journeys, f) {

    if (f.maxChanges < 5 && chg > f.maxChanges) return false;

      const types = new Set(j.legs.map((l) => l.train.type));
      if (!j.legs.some((l) => f.trainTypes.includes(l.train.type))) return false;
    }

  lines.push(`Departure: ${minTo12(j.departAbs)}  Arrival: ${minTo12(j.arriveAbs)}${dayOffsetLabel(j.arriveAbs)}`);
  lines.push(`Total duration: ${durStr(j.totalDuration)}  Total fare: ${j.totalFare != null ? "Rs." + j.totalFare : "N/A"}  Changes: ${j.trainChanges + j.seatChanges}`);
  lines.push("");
  j.segments.forEach((s, i) => {
    lines.push(`Segment ${i + 1}: ${getStation(s.from).name} -> ${getStation(s.to).name}`);
    lines.push(`  Train: ${s.trainName} (${s.trainNumber}) [${s.trainType || "Express"}]`);
    lines.push(`  Depart: ${minTo12(s.departAbs)}  Arrive: ${minTo12(s.arriveAbs)}${dayOffsetLabel(s.arriveAbs)}`);
    lines.push(`  Coach: ${s.coach || "Coach"}  Seat: ${s.seat || "Confirmed"}  Fare: ${s.fare != null ? "Rs." + s.fare : "N/A"}`);
    if (s.availability_text) {
      lines.push(`  Availability status: ${s.availability_text}`);
    }
    if (s.booking_url) {
      lines.push(`  Booking link: ${s.booking_url}`);
    }
    lines.push("");
  });
  if (j.connections && j.connections.length) {
    lines.push("Connections / transfers:");
    j.connections.forEach((c) => {
      lines.push(`  At ${getStation(c.station).name}: wait ${durStr(c.wait)}${c.short ? " (SHORT TRANSFER - please confirm)" : ""}`);
    });
  }
  lines.push("");
  if (j.isDemo) {
    lines.push(`Availability: ${AVAILABILITY_SOURCE}`);
    lines.push("This itinerary is generated from offline demo data. Real seat availability was not queried. Verify with the operator before travel.");
  } else if (j.isLiveProviderVerified) {
    lines.push("Availability: Confirmed via RailSaathi Backend (Live RailCore Provider)");
    lines.push(`Status: ${j.verificationStatus || "AVAILABLE_COMBINATION"}`);
    lines.push("Point-in-time check. Not a ticket booking. Railway rules on split tickets must be verified before travel.");
  } else {
    lines.push("Availability: Confirmed via RailSaathi Unified Backend Engine");
    lines.push(`Status: ${j.verificationStatus || "AVAILABLE_COMBINATION"}`);
    lines.push("Point-in-time check. Not a ticket booking. Railway rules on split tickets must be verified before travel.");
  }
  return lines.join("\n");
}

// so Details/Book resolve correctly from any result set (chat search or
// direct form search) even after the same physical journey is re-searched

  if (registry && (registry[decoded] || registry[String(ref)])) return registry[decoded] || registry[String(ref)];

  if (Number.isFinite(n) && String(n) === String(ref).trim()) return String(n);

// Intersection-observer reveal hook
function useReveal() {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, shown];
}

function Autocomplete({ value, onSelect, placeholder = "Search city or station", icon = "mapPin", label }) {
  const [q, setQ] = useState(() => { const s = value ? STATION_MAP[value] : null; return s ? `${s.name} (${s.code})` : ""; });
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const ref = useRef(null);
  useEffect(() => { const s = value ? STATION_MAP[value] : null; setQ(s ? `${s.name} (${s.code})` : ""); }, [value]);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const results = useMemo(() => stationSearch(q.includes("(") ? q.slice(0, q.indexOf("(")) : q), [q]);
  return (
    <div className="relative" ref={ref}>
      {label && <label className="block text-xs font-semibold text-navy-500 mb-1.5 uppercase tracking-wide">{label}</label>}
      <div className="relative">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-electric"><Icon name={icon} size={18} /></span>
        <input
          value={q} onChange={(e) => { setQ(e.target.value); setOpen(true); setHi(0); }}
          onFocus={() => setOpen(true)}
          onBlur={() => {
            const raw = q.trim();
            const codeMatch = raw.match(/\(([A-Za-z]{2,5})\)$/) || raw.match(/^([A-Za-z]{2,5})$/);
            if (codeMatch) {
              const typedCode = codeMatch[1].toUpperCase();
              if (typedCode !== value) onSelect(typedCode);
            }
          }}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              if (open && results[hi]) { onSelect(results[hi].code); setOpen(false); return; }
              const raw = q.trim();
              if (/^[A-Za-z]{2,5}$/.test(raw)) { onSelect(raw.toUpperCase()); setOpen(false); }
              return;
            }
            if (!open) return;
            if (e.key === "ArrowDown") { e.preventDefault(); setHi((h) => Math.min(h + 1, results.length - 1)); }
            if (e.key === "ArrowUp") { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
            if (e.key === "Escape") setOpen(false);
          }}
          placeholder={placeholder}
          className="w-full pl-10 pr-3 py-3 rounded-xl border border-navy-200 bg-white text-navy-900 placeholder-navy-300 focus:outline-none focus:border-electric focus:ring-2 focus:ring-cyanx-400/30 text-sm font-medium"
        />
      </div>
      {open && results.length > 0 && (
        <div className="absolute z-40 mt-2 w-full bg-white rounded-xl border border-navy-100 shadow-cardlg overflow-hidden max-h-72 overflow-y-auto">
          {results.map((s, i) => (
            <button key={s.code} onMouseEnter={() => setHi(i)} onClick={() => { onSelect(s.code); setOpen(false); }}
              className={cx("w-full flex items-center gap-3 px-3.5 py-2.5 text-left transition-colors", i === hi ? "bg-navy-50" : "bg-white")}>
              <span className="grid place-items-center w-8 h-8 rounded-lg bg-cyanx-500/10 text-cyanx-600 shrink-0"><Icon name="mapPin" size={15} /></span>
              <span className="min-w-0 flex-1">
                <span className="block text-sm font-semibold text-navy-900 truncate">{s.name}</span>
                <span className="block text-xs text-navy-400">{s.city}, {s.state}</span>
              </span>
              <span className="text-xs font-bold text-navy-400">{s.code}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function PassengersStepper({ value, onChange }) {

function ClassSelect({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => { const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", onDoc); return () => document.removeEventListener("mousedown", onDoc); }, []);
  const cur = CLASSES.find((c) => c.code === value);
  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between rounded-xl border border-navy-200 bg-white px-3 py-3 text-left">
        <span className="flex items-center gap-2 text-electric"><Icon name="ticket" size={18} /><span className="text-sm font-semibold text-navy-900">{cur ? cur.label : "Select class"}</span></span>
        <Icon name="chevronDown" size={16} className={cx("text-navy-400 transition-transform", open && "rotate-180")} />
      </button>
      {open && (
        <div className="absolute z-40 mt-2 w-full bg-white rounded-xl border border-navy-100 shadow-cardlg overflow-hidden">
          {CLASSES.map((c) => (
            <button key={c.code} onClick={() => { onChange(c.code); setOpen(false); }} className={cx("w-full text-left px-3.5 py-2.5 text-sm hover:bg-navy-50", c.code === value ? "bg-navy-50 font-semibold text-electric" : "text-navy-700")}>{c.label}</button>
          ))}
        </div>
      )}
    </div>
  );
}

function SearchCard({ compact = false }) {
  const { search, runSearch, searchMode, isSearching } = useApp();
  const [from, setFrom] = useState(() => (compact && search?.from) || "MYS");
  const [to, setTo] = useState(() => (compact && search?.to) || "BGM");
  const [date, setDate] = useState(() => (compact && search?.date) || todayISO());
  const [pax, setPax] = useState(() => (compact && search?.passengers) || 1);
  const [cls, setCls] = useState(() => (compact && search?.travelClass) || "SL");
  useEffect(() => {
    if (!compact || !search) return;
    if (search.from) setFrom(search.from);
    if (search.to) setTo(search.to);
    if (search.date) setDate(search.date);
    if (search.passengers) setPax(search.passengers);
    if (search.travelClass) setCls(search.travelClass);
  }, [compact, search]);
  const swap = () => { setFrom(to); setTo(from); };
  const submit = () => { if (!isSearching) runSearch({ from, to, date, passengers: pax, travelClass: cls }); };

  if (compact) {
    return (

            <Autocomplete value={to} onSelect={setTo} placeholder="To" icon="mapPin" />

          </div>
          <div className="flex-1 grid grid-cols-2 md:flex md:items-center gap-2">

            <ClassSelect value={cls} onChange={setCls} />
          </div>
          <Button variant="primary" size="lg" disabled={isSearching} onClick={submit} className="md:px-7"><Icon name="search" size={18}/> Search</Button>

        <div className="flex items-center gap-2">
          <Badge color={searchMode === "demo" ? "amber" : "emerald"} icon={searchMode === "demo" ? "info" : "shield"}>

        <Autocomplete value={from} onSelect={setFrom} label="From" placeholder="Departure city" icon="mapPin" />
        <Autocomplete value={to} onSelect={setTo} label="To" placeholder="Destination city" icon="mapPin" />
        <button onClick={swap} className="hidden md:grid place-items-center absolute left-1/2 top-[42px] -translate-x-1/2 w-10 h-10 rounded-full bg-white border-2 border-navy-100 text-navy-500 hover:text-electric hover:border-electric shadow-card transition-all hover:scale-105 z-10" aria-label="Swap source and destination"><Icon name="swap" size={18} /></button>
      </div>
      <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label className="block text-xs font-semibold text-navy-500 mb-1.5 uppercase tracking-wide">Journey date</label>
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-electric pointer-events-none"><Icon name="calendar" size={18} /></span>

function RailwayIllustration() {
  const path = "M40,240 C150,150 220,250 300,200 C380,150 460,240 560,150 C660,80 760,250 900,130";
  const stops = [
    { x: 40, y: 240, code: "MYS", name: "Mysuru", kind: "start" },
    { x: 300, y: 200, code: "ASK", name: "Arsikere", kind: "seat" },
    { x: 560, y: 150, code: "DWR", name: "Dharwad", kind: "seat" },
    { x: 900, y: 130, code: "BGM", name: "Belagavi", kind: "dest" },
  ];
  const color = (k) => k === "start" ? "#2563eb" : k === "seat" ? "#f59e0b" : "#10b981";
  return (
    <svg viewBox="0 0 940 300" className="w-full h-auto" role="img" aria-label="Animated railway route from Mysuru to Belagavi">
      <defs>
        <linearGradient id="railgrad" x1="0" x2="1">
          <stop offset="0" stopColor="#2563eb"/><stop offset="0.5" stopColor="#06b6d4"/><stop offset="1" stopColor="#10b981"/>
        </linearGradient>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <path d={path} fill="none" stroke="#e6ecf7" strokeWidth="12" strokeLinecap="round" />
      <path d={path} fill="none" stroke="url(#railgrad)" strokeWidth="4" strokeLinecap="round" opacity="0.5" />
      <path id="railPath" d={path} fill="none" stroke="#06b6d4" strokeWidth="3" strokeLinecap="round" className="rail-line" />
      {stops.map((s) => (
        <g key={s.code}>
          {s.kind !== "start" && <circle cx={s.x} cy={s.y} r="13" fill={color(s.kind)} opacity="0.18" filter="url(#soft)" />}
          <circle cx={s.x} cy={s.y} r="7" fill="#fff" stroke={color(s.kind)} strokeWidth="3" />
          <circle cx={s.x} cy={s.y} r="2.5" fill={color(s.kind)} />
          <text x={s.x} y={s.y - 16} textAnchor="middle" className="font-display" fontSize="14" fontWeight="700" fill="#0a1530">{s.name}</text>
          <text x={s.x} y={s.y + 24} textAnchor="middle" fontSize="10" fontWeight="600" fill="#6b7280">{s.kind === "start" ? "Boarding" : s.kind === "seat" ? "Seat change" : "Destination"}</text>
        </g>
      ))}
      <g>
        <g transform="translate(-13,-9)">
          <rect x="0" y="0" width="26" height="18" rx="4" fill="#06b6d4" />
          <rect x="2" y="3" width="8" height="5" rx="1" fill="#e0f7ff" opacity="0.9" />
          <circle cx="6" cy="18" r="3" fill="#0a1530" />
          <circle cx="20" cy="18" r="3" fill="#0a1530" />
          <rect x="22" y="6" width="5" height="6" rx="1" fill="#0e7490" />
        </g>
        <animateMotion dur="6.5s" repeatCount="indefinite" rotate="auto"><mpath href="#railPath" /></animateMotion>
      </g>
    </svg>
  );
}

function Hero() {
  const stageRef = useRef(null);
  const R = { l: useRef(null), r: useRef(null), img: useRef(null), duo: useRef(null), dc: useRef(null), db: useRef(null), title: useRef(null), ta: useRef(null), tb: useRef(null) };
  useEffect(() => {
    const root = document.documentElement;
    if (!root.classList.contains("fx")) return;
    const hero = stageRef.current ? stageRef.current.parentElement : null;
    if (!hero) return;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let ticking = false;
    function apply() {
      try {
        const vp = window.innerHeight;
        const heroH = hero.offsetHeight;
        const p = clamp((window.scrollY || 0) / Math.max(1, heroH - vp), 0, 1);
        if (R.l.current) R.l.current.style.transform = "translateX(" + (-115 * p) + "%)";
        if (R.r.current) R.r.current.style.transform = "translateX(" + (115 * p) + "%)";
        if (R.img.current) R.img.current.style.transform = "scale(" + (1.12 - 0.12 * p) + ")";
        if (R.duo.current) R.duo.current.style.opacity = String(0.22 * p);
        if (R.dc.current) { R.dc.current.style.left = (50 - 44 * p) + "%"; R.dc.current.style.top = (50 - 36 * p) + "%"; }
        if (R.db.current) { R.db.current.style.left = (50 + 44 * p) + "%"; R.db.current.style.top = (50 + 36 * p) + "%"; }
        if (R.title.current) {
          R.title.current.style.transform = "translate(-50%, -50%) scale(" + (1 + 0.22 * p) + ")";
          R.title.current.style.letterSpacing = (-0.02 - 0.03 * p) + "em";
          const wa = R.ta.current ? R.ta.current.offsetWidth : 0;
          const wb = R.tb.current ? R.tb.current.offsetWidth : 0;
          if (R.ta.current) R.ta.current.style.transform = "translateX(" + (-0.5 * wa * p) + "px)";
          if (R.tb.current) R.tb.current.style.transform = "translateX(" + (0.5 * wb * p) + "px)";
        }
      } catch (e) { root.classList.remove("fx"); }
    }
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { apply(); ticking = false; }); } };
    apply();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
  }, []);
  return (
    <section className="portal-hero" aria-label="RailRoute AI">
      <div className="portal-stage" ref={stageRef}>
        <div className="portal-img" ref={R.img}>
          <div className="portal-grid" />
          <div className="portal-glow" />
          <svg className="portal-rail" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <path d="M40,320 C220,120 460,500 680,200 S1060,380 1180,160" fill="none" stroke="#22d3ee" strokeWidth="2" strokeLinecap="round" className="rail-line" opacity="0.55" />
            <path d="M120,460 C300,300 540,560 760,300 S1080,420 1180,300" fill="none" stroke="#2563eb" strokeWidth="2" strokeLinecap="round" className="rail-line" opacity="0.40" />
          </svg>
        </div>
        <div className="portal-duotone" ref={R.duo} aria-hidden="true" />
        <div className="portal-veil" aria-hidden="true" />
        <div className="portal-panel left" ref={R.l} aria-hidden="true" />
        <div className="portal-panel right" ref={R.r} aria-hidden="true" />
        <span className="portal-dot cyan" ref={R.dc} aria-hidden="true" />
        <span className="portal-dot blue" ref={R.db} aria-hidden="true" />
        <h1 className="portal-title" ref={R.title}>
          <span className="pt-a" ref={R.ta}>RailRoute</span><span className="pt-b" ref={R.tb}>{" AI"}</span>
        </h1>
        <div className="portal-corner tl">RailRoute AI — Demo data</div>
        <div className="portal-corner tr">Portal / 01</div>
        <div className="portal-corner bl">Search · Connect · Discover</div>
        <div className="portal-corner br">Scroll to open ↓</div>
      </div>
    </section>
  );
}

function HeroIntro() {
  const illusRef = useRef(null);
  useEffect(() => {
    if (!document.documentElement.classList.contains("fx")) return;
    const el = illusRef.current; if (!el) return;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    let ticking = false;
    function apply() {
      const r = el.getBoundingClientRect();
      const vp = window.innerHeight;
      const p = clamp((vp - r.top) / (vp + r.height), 0, 1);
      const ty = (0.5 - p) * 24;
      const rot = (0.5 - p) * 1.6;
      el.style.transform = "translateY(" + ty.toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg)";

    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { apply(); ticking = false; }); } };

function StepDeck() {
  const n = HOW_STEPS.length;
  const [topIdx, setTopIdx] = useState(0);
  const deckRef = useRef(null);
  const cardRefs = useRef([]);
  const drag = useRef({ dragging: false, sx: 0, sy: 0, dw: 0 });
  const busy = useRef(false);
  const offs = [
    { x: 0, y: 0, r: 0, s: 1 },
    { x: 9, y: 7, r: 1.6, s: .965 },
    { x: -8, y: 11, r: -2.1, s: .93 },
    { x: 7, y: 15, r: 2.5, s: .895 },
    { x: -10, y: 19, r: -1.7, s: .86 }
  ];
  const off = (pos) => offs[pos % offs.length];

  const restack = (thrown, newTop, animateOthers) => {
    cardRefs.current.forEach((el, i) => {
      if (!el) return;
      const pos = (i - newTop + n) % n;
      const o = off(pos);
      el.style.zIndex = String(10 - pos);
      if (i === thrown) {
        el.style.transition = "none";
        el.style.transform = "translate(" + o.x + "px," + o.y + "px) rotate(" + o.r + "deg) scale(" + o.s + ")";
        el.style.opacity = "0";
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.transition = "opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1)";
          el.style.opacity = "1";
        }));
      } else {
        el.style.transition = animateOthers ? "transform .55s cubic-bezier(.2,.7,.2,1), opacity .45s ease" : "none";
        el.style.transform = "translate(" + o.x + "px," + o.y + "px) rotate(" + o.r + "deg) scale(" + o.s + ")";
        el.style.opacity = "1";
      }
    });
  };

  useEffect(() => {
    cardRefs.current.forEach((el, i) => {
      if (!el) return;
      const pos = (i - topIdx + n) % n;
      const o = off(pos);
      el.style.zIndex = String(10 - pos);
      el.style.transition = "none";
      el.style.transform = "translate(" + o.x + "px," + o.y + "px) rotate(" + o.r + "deg) scale(" + o.s + ")";
      el.style.opacity = "1";
    });
  }, []);

  const throwCard = (dir, dx) => {
    if (drag.current.dragging || busy.current) return;
    const deck = deckRef.current; if (!deck) return;
    const dw = deck.offsetWidth;
    const t = cardRefs.current[topIdx]; if (!t) return;
    busy.current = true;
    const dy = dx != null ? Math.max(-80, Math.min(80, (dx || 0) * 0.25)) : 0;
    t.style.transition = "transform .5s cubic-bezier(.2,.7,.2,1)";
    t.style.transform = "translate(" + (dir * dw * 1.35) + "px," + (-46 + dy) + "px) rotate(" + (dir * 24) + "deg) scale(1.06)";
    const thrown = topIdx;
    setTimeout(() => {
      const newTop = (thrown + 1) % n;
      restack(thrown, newTop, true);
      setTopIdx(newTop);
      busy.current = false;
    }, 470);
  };

  const onPointerDown = (e) => {
    const deck = deckRef.current; if (!deck) return;
    const card = e.target.closest(".step-card");
    if (!card || card !== cardRefs.current[topIdx]) return;
    const st = drag.current;
    st.dragging = true; st.sx = e.clientX; st.sy = e.clientY; st.dw = deck.offsetWidth;
    card.style.transition = "none";
    try { deck.setPointerCapture(e.pointerId); } catch (err) {}
    deck.classList.add("dragging");
  };
  const onPointerMove = (e) => {
    const st = drag.current; if (!st.dragging) return;
    const top = cardRefs.current[topIdx]; if (!top) return;
    const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
    const rot = Math.max(-18, Math.min(18, dx * 0.06));
    top.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg) scale(1.06)";
  };
  const onPointerUp = (e) => {
    const st = drag.current; if (!st.dragging) return;
    const dx = (e.clientX != null ? e.clientX : st.sx) - st.sx;
    const dir = dx === 0 ? 0 : Math.sign(dx);
    const thr = 0.1 * st.dw;
    st.dragging = false;
    const deck = deckRef.current; if (deck) deck.classList.remove("dragging");
    if (Math.abs(dx) > thr && dir !== 0) {
      throwCard(dir, dx);
    } else {
      const top = cardRefs.current[topIdx];
      if (top) {
        const o = off(0);
        top.style.transition = "transform .5s cubic-bezier(.2,.7,.2,1)";
        top.style.transform = "translate(" + o.x + "px," + o.y + "px) rotate(" + o.r + "deg) scale(" + o.s + ")";
      }
    }
  };
  const onKeyDown = (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); throwCard(-1, 0); }
    else if (e.key === "ArrowRight") { e.preventDefault(); throwCard(1, 0); }
  };

  return (
    <div className="deck-col">
      <div
        className="step-deck"
        ref={deckRef}
        tabIndex={0}
        role="group"
        aria-label="How it works steps — drag, swipe, or use the left and right arrow keys"
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onKeyDown={onKeyDown}
      >
        {HOW_STEPS.map((s, i) => (
          <article key={s.title} ref={(el) => { cardRefs.current[i] = el; }} className="step-card">
            <div className="absolute top-5 right-5 font-display text-5xl font-extrabold text-navy-50">{i + 1}</div>
            <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-electric to-cyanx-500 text-white grid place-items-center shadow-glow mb-4"><Icon name={s.icon} size={22} /></div>
            <h4 className="font-display font-bold text-navy-900 text-lg">{s.title}</h4>
            <p className="mt-2 text-sm text-navy-500 leading-relaxed">{s.text}</p>
            <div className="mt-auto pt-4 text-[11px] uppercase tracking-wider text-navy-400 font-semibold">Step {i + 1} of {n}</div>
          </article>
        ))}
      </div>
      <p className="deck-hint">Drag · swipe · or use ← →</p>
      <div className="deck-dots" role="tablist" aria-label="Step position">
        {HOW_STEPS.map((_, i) => (<span key={i} className={"d" + (i === topIdx ? " on" : "")} />))}
      </div>
    </div>
  );
}

function LandingPage() {
  useEffect(() => {
    const root = document.documentElement;
    const els = document.querySelectorAll(".reveal:not(.in)");
    if (!root.classList.contains("fx") || !("IntersectionObserver" in window)) { els.forEach((el) => el.classList.add("in")); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
  return (
    <main>
      <Hero />
      <HeroIntro />
      <PopularRoutes />
      <StatsStrip />
      <HowItWorks />
      <Benefits />
      <CTASection />
      <Footer />
    </main>
  );
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function filterJourneys(journeys, f) {
  return journeys.filter((j) => {
    if (f.maxDuration && j.totalDuration > f.maxDuration) return false;
    if (f.maxChanges < 5 && (j.trainChanges + j.seatChanges) > f.maxChanges) return false;
    if (f.changeTypes.length && !f.changeTypes.includes(j.changeType)) return false;
    if (f.trainTypes.length && !j.legs.some((l) => f.trainTypes.includes(l.train.type))) return false;
    const depTod = j.departAbs % 1440, arrTod = j.arriveAbs % 1440;
    if (f.departBands.length) { const ok = f.departBands.some((b) => { const bd = TIME_BANDS.find((x) => x.id === b); return depTod >= bd.min && depTod < bd.max; }); if (!ok) return false; }
    if (f.arriveBands.length) { const ok = f.arriveBands.some((b) => { const bd = TIME_BANDS.find((x) => x.id === b); return arrTod >= bd.min && arrTod < bd.max; }); if (!ok) return false; }
    if (f.overnight === "only" && !j.overnight) return false;
    if (f.overnight === "exclude" && j.overnight) return false;
    return true;
  });
}

function RouteMap({ journey, compact = false }) {
  const stations = useMemo(() => {
    const seq = [journey.segments[0].from];
    journey.segments.forEach((s) => seq.push(s.to));
    return seq;
  }, [journey]);
  const [sel, setSel] = useState(0);
  const W = 1000, H = compact ? 130 : 240, padX = 46, y = H * 0.42;
  const n = stations.length;
  const xs = stations.map((_, i) => (n === 1 ? W / 2 : padX + (i * (W - 2 * padX)) / (n - 1)));
  const nodeColor = (i) => {
    if (i === 0) return "#2563eb";
    if (i === n - 1) return "#10b981";
    return changeStyle(journey.segments[i].boundary === "train" ? "train" : "seat").hex;
  };
  const selStation = getStation(stations[sel]);
  const selConn = sel > 0 && sel < n - 1 ? journey.connections.find((c) => c.station === stations[sel]) : null;
  const arrSeg = sel > 0 ? journey.segments[sel - 1] : null;
  const depSeg = sel < n - 1 ? journey.segments[sel] : null;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
        <defs>
          <linearGradient id="rmline" x1="0" x2="1"><stop offset="0" stopColor="#2563eb" /><stop offset="1" stopColor="#06b6d4" /></linearGradient>
        </defs>
        <line x1={xs[0]} y1={y} x2={xs[n - 1]} y2={y} stroke="url(#rmline)" strokeWidth={compact ? 4 : 6} strokeLinecap="round" />
        <line x1={xs[0]} y1={y} x2={xs[n - 1]} y2={y} stroke="#22d3ee" strokeWidth={compact ? 2 : 3} strokeLinecap="round" className="rail-line" opacity="0.7" />
        {stations.map((s, i) => {
          const col = nodeColor(i);
          const st = getStation(s);
          return (
            <g key={s + i} className="station-node" onClick={() => setSel(i)}>
              {sel === i && <circle cx={xs[i]} cy={y} r={compact ? 11 : 15} fill={col} opacity="0.18" />}
              <circle cx={xs[i]} cy={y} r={compact ? 6 : 9} fill="#fff" stroke={col} strokeWidth={compact ? 3 : 4} />
              <circle cx={xs[i]} cy={y} r={compact ? 2.5 : 3.5} fill={col} />
              <text x={xs[i]} y={y + (compact ? 22 : 30)} textAnchor="middle" fontSize={compact ? 11 : 13} fontWeight="700" fill="#0a1530">{st.city}</text>
              {!compact && <text x={xs[i]} y={y - 16} textAnchor="middle" fontSize="10" fontWeight="600" fill="#6b7280">{i === 0 ? "Start" : i === n - 1 ? "Dest" : journey.segments[i].boundary === "train" ? "Train chg" : "Seat chg"}</text>}
            </g>
          );
        })}
      </svg>
      {!compact && (
        <Card className="mt-3 p-4 bg-navy-50/40">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full" style={{ background: nodeColor(sel) }} />
                <h5 className="font-display font-bold text-navy-900">{selStation.name} <span className="text-navy-400 font-normal">({selStation.code})</span></h5>
              </div>
              <p className="text-xs text-navy-500 mt-0.5">{selStation.city}, {selStation.state} · {sel === 0 ? "Boarding station" : sel === n - 1 ? "Final destination" : journey.segments[sel].boundary === "train" ? "Train change point" : "Seat change point"}</p>
            </div>
            <Badge color="navy" icon="mapPin">Station {sel + 1} of {n}</Badge>
          </div>
          <div className="mt-3 grid sm:grid-cols-2 gap-3 text-sm">
            {arrSeg && (
              <div className="rounded-lg bg-white border border-navy-100 p-3">
                <div className="text-xs text-navy-400 font-semibold uppercase mb-1">Arriving</div>
                <div className="font-semibold text-navy-900">{arrSeg.trainName} <span className="text-navy-400">({arrSeg.trainNumber})</span></div>
                <div className="text-navy-600 text-xs mt-0.5">Arrives {minTo12(arrSeg.arriveAbs)}{dayOffsetLabel(arrSeg.arriveAbs)}{arrSeg.toPlatform ? ` · Pl ${arrSeg.toPlatform}` : ""}</div>

            )}

              <div className="rounded-lg bg-white border border-navy-100 p-3">
                <div className="text-xs text-navy-400 font-semibold uppercase mb-1">Departing</div>

                <div className="text-navy-600 text-xs mt-0.5">Departs {minTo12(depSeg.departAbs)}{depSeg.fromPlatform ? ` · Pl ${depSeg.fromPlatform}` : ""}</div>
              </div>

          {selConn && (
            <div className={cx("mt-3 rounded-lg p-3 flex items-center gap-2 text-sm", selConn.short ? "bg-rose-50 text-rose-700" : "bg-emerald-50 text-emerald-700")}>

/* ===================== FASTAPI BACKEND CLIENT & ADAPTER ===================== */
const RAILSAATHI_CONFIG = {
  get baseUrl() {
    // 1. Explicit override always wins (local dev against any backend).
    if (window.RAILSAATHI_API_URL) {
      return String(window.RAILSAATHI_API_URL).replace(/\/+$/, "");
    }
    // 2. Local development (file://, localhost, 127.0.0.1) -> FastAPI on :8000.
    const host = (window.location && window.location.hostname) || "";
    const isLocal = host === "127.0.0.1" || host === "localhost" || host === "0.0.0.0" || window.location.protocol === "file:";
    if (isLocal) return "http://127.0.0.1:8000";
    // 3. Hosted deployments (Vercel): API is served same-origin at /api/v1/*.
    return "";
  },
  get baseUrlLabel() {
    const b = this.baseUrl;
    return b || (window.location && window.location.origin) || "same-origin /api";
  },
  timeoutMs: 65000,
};

async function apiSearchJourneys(query, options = {}) {
  const url = `${RAILSAATHI_CONFIG.baseUrl}/api/v1/journeys/search`;

  const payload = {
    from_station: (query.from || "").trim().toUpperCase(),
    to_station: (query.to || "").trim().toUpperCase(),
    journey_date: query.date || todayISO(),
    travel_class: query.travelClass || "SL",
    quota: query.quota || "GN",
    ranking_preference: query.rankingPreference || "FASTEST",
    via_stations: query.viaStations || [],
    engines: query.engines || ["SAME_TRAIN", "TRAIN_CHANGE", "MIXED"],
    max_results: query.maxResults || 30,
  };

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), RAILSAATHI_CONFIG.timeoutMs);

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
      },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });

    clearTimeout(timeoutId);

    const contentType = res.headers.get("content-type") || "";
    const isJson = contentType.includes("application/json");
    const data = isJson ? await res.json() : await res.text();

    if (!res.ok) {
      let errorMessage = `Backend returned status ${res.status}`;
      let errorDetails = null;

      if (res.status === 422) {
        errorMessage = "Validation error: Please verify station codes, date and travel class.";
        errorDetails = data && data.detail ? data.detail : data;
      } else if (res.status === 502) {
        errorMessage = (data && data.message) || "RailCore provider failure: External railway API was unreachable or returned an error.";
        errorDetails = data;
      } else if (res.status === 503) {
        errorMessage = (data && data.message) || "RailCore API key is not configured on the backend.";
        errorDetails = data;
      } else if (data && data.message) {
        errorMessage = data.message;
        errorDetails = data;
      }

      const err = new Error(errorMessage);
      err.status = res.status;
      err.data = data;
      err.details = errorDetails;
      err.isBackendError = true;
      throw err;
    }

    return data;
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === "AbortError") {
      const timeoutErr = new Error(`Request timed out after ${RAILSAATHI_CONFIG.timeoutMs / 1000}s. The backend may be busy.`);
      timeoutErr.isNetworkError = true;
      throw timeoutErr;
    }
    if (err.isBackendError) {
      throw err;
    }
    const netErr = new Error(`Cannot connect to RailSaathi backend at ${RAILSAATHI_CONFIG.baseUrl}. Ensure the FastAPI server is running with 'uvicorn app.main:app'.`);
    netErr.isNetworkError = true;
    netErr.original = err;
    throw netErr;
  }
}

async function apiAgentChat(message, sessionId = null, clientSlots = null) {
  const url = `${RAILSAATHI_CONFIG.baseUrl}/api/v1/agent/chat`;

  const payload = {
    message: String(message || "").trim(),
    session_id: sessionId || null,
  };
  if (clientSlots) {
    payload.slots = clientSlots;
  }

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), RAILSAATHI_CONFIG.timeoutMs);

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
      },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });

    clearTimeout(timeoutId);

    const contentType = res.headers.get("content-type") || "";
    const isJson = contentType.includes("application/json");
    const data = isJson ? await res.json() : await res.text();

    if (!res.ok) {
      let errorMessage = `Backend returned status ${res.status}`;
      if (res.status === 422) {
        errorMessage = "Validation error: Message was invalid or empty.";
      } else if (res.status === 502) {
        errorMessage = (data && data.message) || "RailCore provider failure: External railway API was unreachable.";
      } else if (res.status === 503) {
        errorMessage = (data && data.message) || "Railway provider or LLM service is not configured on the backend.";
      } else if (data && data.detail) {
        errorMessage = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
      } else if (data && data.message) {
        errorMessage = data.message;
      }

      const err = new Error(errorMessage);
      err.status = res.status;
      err.data = data;
      err.isBackendError = true;
      throw err;
    }

    return data;
  } catch (err) {
    clearTimeout(timeoutId);
    if (err.name === "AbortError") {
      const timeoutErr = new Error(`Request timed out after ${RAILSAATHI_CONFIG.timeoutMs / 1000}s. The backend may be busy.`);
      timeoutErr.isNetworkError = true;
      throw timeoutErr;
    }
    if (err.isBackendError) {
      throw err;
    }
    const netErr = new Error(`Cannot connect to RailSaathi backend at ${RAILSAATHI_CONFIG.baseUrl}. Ensure the FastAPI server is running with 'uvicorn app.main:app'.`);
    netErr.isNetworkError = true;
    netErr.original = err;
    throw netErr;
  }
}

    const name = point.name || point.station_name || code;
    if (code && !STATION_MAP[code]) {
      STATION_MAP[code] = { code, name, city: name, state: "" };
    }
  };

  if (j.departure && j.departure.station) registerStation(j.departure.station);
  if (j.arrival && j.arrival.station) registerStation(j.arrival.station);

  const depTimeStr = j.departure?.time || j.departure?.departure_time || "00:00";
  const depDay = j.departure?.day || j.departure?.departure_day || 1;
  const departAbs = (depDay - 1) * 1440 + (timeToMin(depTimeStr) || 0);

  const arrTimeStr = j.arrival?.time || j.arrival?.arrival_time || "00:00";
  const arrDay = j.arrival?.day || j.arrival?.arrival_day || depDay;
  let arriveAbs = (arrDay - 1) * 1440 + (timeToMin(arrTimeStr) || 0);

  const totalDuration = j.total_duration_minutes != null
    ? j.total_duration_minutes
    : Math.max(0, arriveAbs - departAbs);

  if (arriveAbs <= departAbs && totalDuration > 0) {
    arriveAbs = departAbs + totalDuration;
  }

  const segments = [];
  const rawSegments = j.segments || [];
  const trainChanges = j.train_changes ?? 0;
  const seatChanges = j.seat_changes ?? 0;

  let currentLegIndex = 0;
  let prevTrainNo = null;

  rawSegments.forEach((s, idx) => {
    registerStation(s.from_station);
    registerStation(s.to_station);

    let boundary = null;
    if (idx === 0) {
      boundary = null;
      prevTrainNo = s.train_number;
    } else {
      if (s.segment_type === "TRAIN_CHANGE" || (s.train_number !== prevTrainNo)) {
        boundary = "train";
        currentLegIndex++;
      } else {
        boundary = "seat";
      }
      prevTrainNo = s.train_number;
    }

    const sDepTimeStr = s.departure_time || "00:00";
    const sDepDay = s.departure_day || 1;
    const sDepartAbs = (sDepDay - 1) * 1440 + (timeToMin(sDepTimeStr) || 0);

    const sArrTimeStr = s.arrival_time || "00:00";
    const sArrDay = s.arrival_day || sDepDay;
    let sArriveAbs = (sArrDay - 1) * 1440 + (timeToMin(sArrTimeStr) || 0);
    if (sArriveAbs < sDepartAbs) sArriveAbs += 1440;

    const sDur = Math.max(0, sArriveAbs - sDepartAbs);
    const dist = s.segment_distance_km != null ? Math.round(s.segment_distance_km) : null;

    const isAvailable = s.status === "CONFIRMED_AVAILABLE";
    const availText = s.availability_text || (isAvailable ? "AVAILABLE" : s.status);

    const fromCode = s.from_station ? (s.from_station.code || s.from_station.station_code) : "";
    const toCode = s.to_station ? (s.to_station.code || s.to_station.station_code) : "";
    const segFare = s.fare != null ? s.fare : (s.total_fare != null ? s.total_fare : null);

    segments.push({
      trainNumber: s.train_number,
      trainName: s.train_name || ("Train #" + s.train_number),
      trainType: (s.train_name && s.train_name.includes("SF")) ? "Superfast" : "Express",
      from: fromCode,
      to: toCode,
      fromPlatform: (s.from_station && s.from_station.platform) || null,
      toPlatform: (s.to_station && s.to_station.platform) || null,
      departAbs: sDepartAbs,
      arriveAbs: sArriveAbs,
      duration: sDur,
      dist: dist,
      fare: segFare,
      coach: s.coach || (s.travel_class || "Coach"),
      seat: s.seat || (s.available_count != null ? `Seat (${s.available_count} avail)` : (isAvailable ? (availText.replace("AVAILABLE ", "") || "Confirmed") : (availText || s.status || "Unverified"))),
      boundary: boundary,
      legIndex: currentLegIndex,
      status: isAvailable ? "available" : "unverified",
      availability_text: availText,
      booking_url: s.booking_url || (s.train_number ? `https://www.irctc.co.in/nget/booking/train-list?trainNo=${s.train_number}` : null),
      rawStatus: s.status,
      providerStatus: s.provider_status,
      checkedAt: s.checked_at,
    });
  });

  const connections = [];
  let totalWait = 0;
  const rawTransitions = j.transitions || [];

  rawTransitions.forEach((t) => {
    registerStation(t.station);
    const wait = t.wait_minutes != null ? t.wait_minutes : (t.onboard_halt_minutes || 0);
    if (t.is_train_change) totalWait += wait;

    const stCode = t.station ? (t.station.code || t.station.station_code) : "";
    const stName = t.station ? (t.station.name || t.station.station_name || stCode) : stCode;

    connections.push({
      station: stCode,
      stationName: stName,
      wait: wait,
      short: t.is_train_change && wait < 20,
      arriveAbs: t.arrival_datetime ? timeToMin(t.arrival_datetime.slice(11, 16)) : null,
      departAbs: t.departure_datetime ? timeToMin(t.departure_datetime.slice(11, 16)) : null,
      platformFrom: (t.station && t.station.platform) || null,
      platformTo: (t.station && t.station.platform) || null,
      isTrainChange: Boolean(t.is_train_change),
      transitionType: t.transition_type,
    });
  });

  let changeType = "direct";
  if (trainChanges > 0 && seatChanges > 0) {
    changeType = "combined";
  } else if (trainChanges > 0) {
    changeType = "train";
  } else if (seatChanges > 0) {
    changeType = "seat";
  } else if (j.journey_type === "SAME_TRAIN_SEGMENTS") {
    changeType = "seat";
  } else if (j.journey_type === "TRAIN_CHANGE") {
    changeType = "train";
  } else if (j.journey_type === "MIXED") {
    changeType = "combined";
  }

  const distinctTrainNos = j.distinct_trains || [...new Set(segments.map(s => s.trainNumber))];
  const legs = distinctTrainNos.map((trainNo) => {
    const legSegs = segments.filter(s => s.trainNumber === trainNo);
    const first = legSegs[0] || {};
    const last = legSegs[legSegs.length - 1] || {};
    const legDistsKnown = legSegs.length > 0 && legSegs.every(s => s.dist != null);
    return {
      train: {
        number: trainNo,
        name: first.trainName || trainNo,
        type: first.trainType || "Express",
      },
      intervals: legSegs,
      departAbs: first.departAbs || departAbs,
      arriveAbs: last.arriveAbs || arriveAbs,
      duration: Math.max(0, (last.arriveAbs || arriveAbs) - (first.departAbs || departAbs)),
      dist: legDistsKnown ? legSegs.reduce((sum, s) => sum + s.dist, 0) : null,
      seatChanges: Math.max(0, legSegs.length - 1),
    };
  });

  const allFaresKnown = segments.length > 0 && segments.every(s => s.fare != null);
  const totalFare = j.total_fare != null ? j.total_fare : (allFaresKnown ? segments.reduce((sum, s) => sum + s.fare, 0) : null);
  const allDistsKnown = segments.length > 0 && segments.every(s => s.dist != null);
  const totalDist = j.total_distance_km != null ? Math.round(j.total_distance_km) : (allDistsKnown ? segments.reduce((sum, s) => sum + s.dist, 0) : null);

  const score = aiScore({
    totalDuration,
    totalFare,
    trainChanges,
    seatChanges,
    totalWait,
    overnight: Boolean(j.overnight),
    connections,
  });

  return {
    key: j.journey_id,
    id: j.journey_id,
    journeyId: j.journey_id,
    departAbs,
    arriveAbs,
    totalDuration,
    totalFare,
    totalDist,
    trainChanges,
    seatChanges,
    changeType,
    overnight: Boolean(j.overnight),
    segments,
    connections,
    legs,
    totalWait,
    score,
    sourceEngines: j.source_engines || [],
    isUnverified: isUnverified,
    isLiveProviderVerified: Boolean(isLiveProvider && !isUnverified),
    verificationStatus: j.journey_status || (isUnverified ? "PARTIALLY_VERIFIED" : "AVAILABLE_COMBINATION"),
    allConfirmed: Boolean(j.all_segments_confirmed_available),
    bookingUrl: (segments.find(s => s.booking_url) || {}).booking_url || (segments[0] && segments[0].trainNumber ? `https://www.irctc.co.in/nget/booking/train-list?trainNo=${segments[0].trainNumber}` : null),
    isDemo: false,
  };
}

function adaptBackendResponse(resp) {
  // Live provider verification is only claimed if explicitly established by the backend response
  const isLiveProvider = Boolean(
    resp && (
      resp.is_live_provider === true ||
      resp.live_verified === true ||
      resp.provider_mode === "live" ||
      (resp.api_usage && resp.api_usage.is_live === true)
    )
  );

  const confirmed = (resp.results || []).map(j => adaptUnifiedJourney(j, false, isLiveProvider));
  const unverified = (resp.unverified_candidates || []).map(j => adaptUnifiedJourney(j, true, isLiveProvider));

  return {
    success: resp.success,
    status: resp.status,
    message: resp.message,
    rankedBy: resp.ranked_by,
    results: confirmed,
    unverifiedCandidates: unverified,
    totalResults: resp.total_results || confirmed.length,
    totalUnverifiedCandidates: resp.total_unverified_candidates || unverified.length,
    searchCompleteness: resp.search_completeness,
    deduplication: resp.deduplication,
    perEngine: resp.per_engine || [],
    directTrains: resp.direct_trains || [],
    availabilityCheckedAt: resp.availability_checked_at,
    isLiveProvider: isLiveProvider,
    notes: resp.notes || [],
    errors: resp.errors || [],
  };
}

// sessionStorage JSON helpers (best-effort; quota errors are ignored).
const readSessionJSON = (k) => { try { const raw = sessionStorage.getItem(k); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
const writeSessionJSON = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function AppProvider({ children }) {
  const hash = useHashRoute();
  const route = parseRoute(hash);
  const [user, setUser] = useState(null);
  const [search, setSearch] = useState(() => readSessionJSON("railsaathi_app_search"));
  const [journeys, setJourneys] = useState(() => readSessionJSON("railsaathi_app_journeys"));
  const [unverifiedCandidates, setUnverifiedCandidates] = useState(() => readSessionJSON("railsaathi_app_unverified") || []);
  const [searchMeta, setSearchMeta] = useState(() => readSessionJSON("railsaathi_app_meta"));
  const [searchError, setSearchError] = useState(null);
  const [isSearching, setIsSearching] = useState(false);
  const [searchMode, setSearchMode] = useState("live");
  const [backendResponse, setBackendResponse] = useState(null);
  const [savedJourneys, setSaved] = useState([]);
  const [recentSearches, setRecent] = useState([]);
  const [compareList, setCompare] = useState([]);
  // Registry of every journey seen this session (keyed by journey key) so
  // Details/Book keep working for older cards after a newer search replaces
  // the current result list. Persisted so a reload keeps them resolvable.
  const [journeyRegistry, setJourneyRegistry] = useState(() => readSessionJSON("railsaathi_app_registry") || {});

  // Persist the current search state (best-effort) so a reload keeps the
  // Results/Details/Booking steps working off the last search.
  useEffect(() => {
    writeSessionJSON("railsaathi_app_search", search);
    writeSessionJSON("railsaathi_app_journeys", journeys);
    writeSessionJSON("railsaathi_app_unverified", unverifiedCandidates);
    writeSessionJSON("railsaathi_app_meta", searchMeta);
    writeSessionJSON("railsaathi_app_registry", journeyRegistry);
  }, [search, journeys, unverifiedCandidates, searchMeta, journeyRegistry]);

  const rememberJourneys = useCallback((js) => {
    setJourneyRegistry((prev) => {
      const next = { ...prev };
      (js || []).forEach((j) => { const k = journeyScopeKey(j); if (k) next[k] = j; });
      return next;
    });
  }, []);

  const searchingRef = useRef(false);

  const runSearch = useCallback(async (q, opts = {}) => {
    const mode = opts.mode || "live";
    if (mode !== "demo" && searchingRef.current) return;
    setSearch(q);
    setSearchError(null);
    setRecent((prev) => {
      const key = q.from + "-" + q.to + "-" + q.travelClass;
      return [{ ...q, key, at: Date.now() }, ...prev.filter((p) => p.key !== key)].slice(0, 8);
    });

    if (mode === "demo") {
      setIsSearching(true);
      setSearchMode("demo");
      const js = discoverJourneys(q.from, q.to, q.travelClass, { maxTrains: 3 }).map(j => ({ ...j, isDemo: true, travelClass: q.travelClass, quota: q.quota || "GN" }));
      setJourneys(js);
      rememberJourneys(js);
      setUnverifiedCandidates([]);
      setBackendResponse(null);
      setSearchMeta({
        from: q.from, to: q.to, date: q.date, passengers: q.passengers, travelClass: q.travelClass,
        count: js.length, totalUnverified: 0, status: "DEMO_DATA", isComplete: true, at: Date.now(),
        isLiveProvider: false,
        isDemo: true,
        message: "Offline demo journeys (simulated data)",
      });
      setIsSearching(false);
      navigate("/discover");
      return;
    }

    // Live backend search
    searchingRef.current = true;
    setIsSearching(true);
    setSearchMode("live");
    navigate("/discover");

    try {
      const rawData = await apiSearchJourneys(q, opts);
      const adapted = adaptBackendResponse(rawData);

      const stamped = (adapted.results || []).map((j) => ({ ...j, travelClass: q.travelClass, quota: q.quota || "GN" }));
      setJourneys(stamped);
      rememberJourneys(stamped);
      setUnverifiedCandidates(adapted.unverifiedCandidates);
      setBackendResponse(adapted);
      setSearchMeta({
        from: q.from, to: q.to, date: q.date, passengers: q.passengers, travelClass: q.travelClass,
        count: adapted.results.length,
        totalUnverified: adapted.unverifiedCandidates.length,
        status: adapted.status,
        isComplete: adapted.searchCompleteness ? adapted.searchCompleteness.complete : true,
        searchCompleteness: adapted.searchCompleteness,
        deduplication: adapted.deduplication,
        perEngine: adapted.perEngine,
        at: Date.now(),
        isLiveProvider: adapted.isLiveProvider,
        isDemo: false,
        message: adapted.message,
      });
      setSearchError(null);
    } catch (err) {
      setJourneys(null);
      setUnverifiedCandidates([]);
      setBackendResponse(null);
      setSearchError({
        message: err.message,
        status: err.status,
        details: err.details,
        isNetworkError: Boolean(err.isNetworkError),
        retry: () => runSearch(q, { mode: "live" }),
      });
    } finally {
      searchingRef.current = false;
      setIsSearching(false);
    }
  }, []);

  // Adopt search results produced by the AI Assistant chat so the whole
  // Results / Details / Booking journey works off conversational searches too.
  // Mirrors runSearch's live branch without navigating away from the chat.
  const applyChatSearch = useCallback((q, results, unverified, meta) => {
    setSearch(q);
    setSearchError(null);
    setSearchMode("live");
    setRecent((prev) => {
      const key = q.from + "-" + q.to + "-" + q.travelClass;
      return [{ ...q, key, at: Date.now() }, ...prev.filter((p) => p.key !== key)].slice(0, 8);
    });
    const stamped = (results || []).map((j) => ({ ...j, travelClass: j.travelClass || q.travelClass, quota: j.quota || q.quota }));
    setJourneys(stamped);
    rememberJourneys(stamped);
    rememberJourneys(unverified || []);
    setUnverifiedCandidates(unverified || []);
    setSearchMeta(meta || null);
  }, [rememberJourneys]);

  const toggleSave = useCallback((j) => {
    setSaved((prev) => prev.some((x) => x.key === j.key) ? prev.filter((x) => x.key !== j.key) : [...prev, j]);
  }, []);
  const isSaved = useCallback((j) => savedJourneys.some((x) => x.key === j.key), [savedJourneys]);

  const toggleCompare = useCallback((j) => {
    setCompare((prev) => {
      if (prev.some((x) => x.key === j.key)) return prev.filter((x) => x.key !== j.key);
      if (prev.length >= 3) return prev;
      const rank = journeys ? journeys.indexOf(j) + 1 : 0;
      return [...prev, { journey: j, search, rank, key: j.key }];
    });
  }, [journeys, search]);

  const clearCompare = useCallback(() => setCompare([]), []);
  const signIn = useCallback((name, email) => { setUser({ name, email, initials: initialsOf(name) }); navigate("/dashboard"); }, []);
  const signOut = useCallback(() => { setUser(null); navigate("/"); }, []);

  const value = {
    user, signIn, signOut, search, journeys, unverifiedCandidates,
    searchMeta, searchError, isSearching, searchMode, backendResponse,
    savedJourneys, toggleSave, isSaved, recentSearches,
    compareList, toggleCompare, clearCompare,
    notifications: NOTIFICATIONS, runSearch, applyChatSearch, journeyRegistry,
    routeName: route.name, routeParam: route.param, route
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function AIPage() {
  const { journeys, search, toggleCompare, compareList } = useApp();
  if (!journeys || journeys.length === 0) {
    return <PageShell title="AI Recommendations" breadcrumb={[]}><Card className="p-10 text-center"><p className="text-navy-500">Run a search to see AI-ranked recommendations.</p><Button variant="primary" size="md" className="mt-4" onClick={() => navigate("/")}><Icon name="search" size={15}/> Search</Button></Card></PageShell>;
  }
  const best = computeBest(journeys);
  const ranked = applySort(journeys, "best");
  const metrics = ["totalDuration", "totalFare", "chg", "totalWait"];
  const labels = { totalDuration: "Travel time", totalFare: "Fare", chg: "Changes", totalWait: "Waiting" };
  const vals = (j) => ({ totalDuration: j.totalDuration, totalFare: j.totalFare != null ? j.totalFare : 0, chg: j.trainChanges + j.seatChanges, totalWait: j.totalWait });
  const maxes = metrics.reduce((a, m) => ({ ...a, [m]: Math.max(...journeys.map((j) => vals(j)[m])) }), {});
  const mins = metrics.reduce((a, m) => ({
    ...a,
    [m]: m === "totalFare"
      ? (() => { const fs = journeys.map((j) => j.totalFare).filter((f) => f != null); return fs.length ? Math.min(...fs) : null; })()
      : Math.min(...journeys.map((j) => vals(j)[m])),
  }), {});
  const reason = best ? recommendReason(best.best, best) : "";
  return (
    <PageShell title="AI Recommendations" breadcrumb={[{ label: "Results", action: () => navigate("/discover") }]}>
      <div className="space-y-6">
        <Card className="p-5 md:p-6 bg-gradient-to-br from-navy-900 to-electric text-white relative overflow-hidden">
          <div className="absolute -right-8 -top-8 w-44 h-44 rounded-full bg-cyanx-500/20 blur-2xl" />
          <div className="relative flex items-start gap-4">
            <div className="grid place-items-center w-12 h-12 rounded-xl bg-white/15"><Icon name="sparkles" size={24} className="text-cyanx-300" /></div>
            <div className="flex-1">
              <h3 className="font-display text-lg font-extrabold">Best recommendation</h3>
              <p className="mt-1 text-sm text-navy-100 max-w-2xl">{reason}</p>
              {best && <div className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-sm"><span className="inline-flex items-center gap-1.5"><Icon name="clock" size={14} className="text-cyanx-300" /> {durStr(best.best.totalDuration)}</span><span className="inline-flex items-center gap-1.5"><Icon name="wallet" size={14} className="text-cyanx-300" /> {fmtFare(best.best.totalFare)}</span><span className="inline-flex items-center gap-1.5"><Icon name="route" size={14} className="text-cyanx-300" /> {best.best.trainChanges + best.best.seatChanges} changes</span></div>}
              <div className="mt-4 flex gap-2"><Button variant="white" size="sm" onClick={() => navigate(`/journey/${journeyRef(best.best, journeys.indexOf(best.best) + 1)}`)}>View journey</Button><Button variant="outline" size="sm" className="border-white/30 text-white hover:bg-white/10" onClick={() => toggleCompare(best.best)}><Icon name="compare" size={14}/> Add to compare</Button></div>
            </div>
          </div>
        </Card>

        <Card className="p-5 md:p-6">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 className="font-display font-bold text-navy-900 flex items-center gap-2"><Icon name="gauge" size={18} className="text-electric" /> Dynamic ranking</h3>
              <p className="text-xs text-navy-500 mt-0.5">Multi-factor heuristic scoring based on travel time, fare, changes & transfer buffers (deterministic engine calculation, non-LLM)</p>
            </div>
            <Badge color="navy" icon="info">{journeys.length} journeys scored</Badge>
          </div>
          <div className="space-y-3">
            {ranked.map((j, i) => {
              const v = vals(j); const rank = journeys.indexOf(j) + 1;
              return (
                <div key={j.key} className={cx("rounded-xl border p-4 transition-all", i === 0 ? "border-cyanx-500/30 bg-cyanx-500/5" : "border-navy-100")}>
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <div className="flex items-center gap-2">
                      <span className={cx("grid place-items-center w-7 h-7 rounded-full text-xs font-bold", i === 0 ? "bg-gradient-to-br from-electric to-cyanx-500 text-white" : "bg-navy-100 text-navy-700")}>{i + 1}</span>
                      <span className="font-semibold text-navy-900">Journey #{rank}</span>
                      {i === 0 && <Badge color="cyan" icon="sparkles">Best</Badge>}
                      <Badge color={changeStyle(j.changeType).color}>{changeStyle(j.changeType).label}</Badge>
                    </div>
                    <div className="text-sm text-navy-500">{minTo12(j.departAbs)} → {minTo12(j.arriveAbs)}{dayOffsetLabel(j.arriveAbs)}</div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    {metrics.map((m) => {
                      const val = v[m]; const isMin = m === "totalFare" ? (j.totalFare != null && mins[m] != null && j.totalFare === mins[m]) : (val === mins[m]); const pct = Math.round((val / (maxes[m] || 1)) * 100);
                      const display = m === "totalFare" ? fmtFare(j.totalFare) : m === "totalDuration" || m === "totalWait" ? durStr(val) : val;
                      return (
                        <div key={m}>
                          <div className="flex items-center justify-between text-xs"><span className="text-navy-400">{labels[m]}</span><span className={cx("font-bold", isMin ? "text-emerald-600" : "text-navy-900")}>{display}</span></div>
                          <div className="mt-1 h-1.5 rounded-full bg-navy-100 overflow-hidden"><div className={cx("h-full rounded-full", isMin ? "bg-emerald-500" : "bg-electric")} style={{ width: pct + "%" }} /></div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="mt-3 flex items-center justify-between gap-2">
                    <div className="text-xs text-navy-500">Heuristic score <span className="font-bold text-navy-900">{j.score}</span> · lower is better</div>
                    <div className="flex gap-2"><Button variant="soft" size="sm" onClick={() => toggleCompare(j)} disabled={!compareList.some((c) => c.key === j.key) && compareList.length >= 3}><Icon name="compare" size={13}/> Compare</Button><Button variant="primary" size="sm" onClick={() => navigate(`/journey/${journeyRef(j, rank)}`)}><Icon name="arrowRight" size={13}/> View</Button></div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-4 flex items-center justify-between rounded-xl bg-navy-50 p-4">
            <div className="flex items-center gap-2 text-sm text-navy-600"><Icon name="compare" size={16} className="text-electric" /> Compare up to 3 journeys side by side</div>
            <Button variant="primary" size="sm" onClick={() => navigate("/compare")} disabled={compareList.length < 2}><Icon name="arrowRight" size={13}/> Open compare</Button>
          </div>
        </Card>
      </div>
    </PageShell>
  );
}

function ComparePage() {
  const { compareList, toggleCompare, clearCompare, search } = useApp();
  if (compareList.length < 2) {
    return <PageShell title="Compare Journeys" breadcrumb={[{ label: "Results", action: () => navigate("/discover") }]}>
