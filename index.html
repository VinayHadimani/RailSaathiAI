      </Card>
    </PageShell>;
  }
  const items = compareList;
  const minDur = Math.min(...items.map((c) => c.journey.totalDuration));
  const knownCompareFares = items.map((c) => c.journey.totalFare).filter((f) => f != null);
  const minFare = knownCompareFares.length ? Math.min(...knownCompareFares) : null;
  const minChg = Math.min(...items.map((c) => c.journey.trainChanges + c.journey.seatChanges));
  const Metric = ({ label, value, best, sub }) => (
    <div className="flex items-center justify-between py-2.5 border-b border-navy-100 last:border-0">
      <span className="text-xs font-semibold text-navy-400 uppercase">{label}</span>
      <span className={cx("text-sm font-bold", best ? "text-emerald-600" : "text-navy-900")}>{value}{best && <Icon name="check" size={12} className="inline ml-1" />}{sub && <span className="text-xs text-navy-400 font-normal ml-1">{sub}</span>}</span>
    </div>
  );
  return (
    <PageShell title="Compare Journeys" breadcrumb={[{ label: "Results", action: () => navigate("/discover") }]}
      actions={<Button variant="outline" size="md" onClick={clearCompare}><Icon name="x" size={15}/> Clear all</Button>}>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {items.map((c) => {
          const j = c.journey; const cs = changeStyle(j.changeType);
          return (
            <Card key={c.key} hover className="p-5 flex flex-col">
              <div className="flex items-start justify-between mb-3">
                <div><div className="font-display font-bold text-navy-900">Journey #{c.rank}</div><Badge color={cs.color} className="mt-1">{cs.label}</Badge></div>
                <button onClick={() => toggleCompare(j)} className="text-navy-300 hover:text-rose-500"><Icon name="x" size={16} /></button>
              </div>
              <div className="flex items-center justify-between text-center mb-2 rounded-xl bg-navy-50/50 p-3">
                <div><div className="font-display text-xl font-extrabold text-navy-900">{minTo12(j.departAbs)}</div><div className="text-xs text-navy-400">Depart</div></div>
                <Icon name="arrowRight" size={16} className="text-electric" />
                <div><div className="font-display text-xl font-extrabold text-navy-900">{minTo12(j.arriveAbs)}<span className="text-xs text-violet-500">{dayOffsetLabel(j.arriveAbs)}</span></div><div className="text-xs text-navy-400">Arrive</div></div>
              </div>
              <Metric label="Duration" value={durStr(j.totalDuration)} best={j.totalDuration === minDur} />
              <Metric label="Total fare" value={fmtFare(j.totalFare)} best={j.totalFare != null && minFare != null && j.totalFare === minFare} />
              <Metric label="Changes" value={j.trainChanges + j.seatChanges} sub={`${j.trainChanges}T/${j.seatChanges}S`} best={(j.trainChanges + j.seatChanges) === minChg} />
              <Metric label="Distance" value={fmtDist(j.totalDist)} />
              <Metric label="Overnight" value={j.overnight ? "Yes" : "No"} />
              <Metric label="Verification" value={j.isUnverified ? "Unverified" : "Confirmed"} />
              <div className="mt-3"><Button variant="soft" size="sm" className="w-full" onClick={() => navigate(`/journey/${journeyRef(c.journey, c.rank)}`)}>View details <Icon name="arrowRight" size={13}/></Button></div>
            </Card>
          );
        })}
      </div>
      <div className="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {items.map((c) => (
          <Card key={c.key} className="p-4"><h5 className="text-sm font-bold text-navy-900 mb-2">Journey #{c.rank} route</h5><RouteMap journey={c.journey} compact /></Card>
        ))}
      </div>
    </PageShell>
  );
}

function ConversationalAssistant() {
  const { toggleSave, isSaved, toggleCompare, compareList, applyChatSearch } = useApp();
  const [sessionId, setSessionId] = useState(() => {
    try { return sessionStorage.getItem("railsaathi_chat_session") || null; } catch (e) { return null; }
  });
  const [messages, setMessages] = useState(() => {
    // Restore the persisted transcript (chat survives navigating to
    // Results/Details/Booking and back within this browser tab).
    try {
      const raw = sessionStorage.getItem("railsaathi_chat_messages");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) {}
    return [
    {
      id: "welcome",
      role: "assistant",
      text: "Hello! I am RailSaathi AI, your conversational railway journey discovery assistant. Where would you like to travel?",
      status: "GREETING",
      timestamp: Date.now(),
      suggestedActions: [
        "Find trains from Bengaluru to Chennai tomorrow",
        "Trains from Pune to Mumbai day after tomorrow in 3A",
        "New Delhi to Mumbai CSMT tomorrow",
      ],
    }
  ];
  });
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [activeSlots, setActiveSlots] = useState(() => readSessionJSON("railsaathi_chat_slots"));
  const [lastError, setLastError] = useState(null);
  const chatEndRef = useRef(null);
  const textareaRef = useRef(null);
  const loadingRef = useRef(false);

  useEffect(() => {
    if (sessionId) {
      try { sessionStorage.setItem("railsaathi_chat_session", sessionId); } catch (e) {}
    } else {
      try { sessionStorage.removeItem("railsaathi_chat_session"); } catch (e) {}
    }
  }, [sessionId]);

  useEffect(() => {
    if (activeSlots) {
      writeSessionJSON("railsaathi_chat_slots", activeSlots);
    } else {
      try { sessionStorage.removeItem("railsaathi_chat_slots"); } catch (e) {}
    }
  }, [activeSlots]);

  // Persist the transcript (last 30 messages) so navigating between the
  // stepper pages does not wipe the conversation.
  useEffect(() => {
    try {
      sessionStorage.setItem("railsaathi_chat_messages", JSON.stringify(messages.slice(-30)));
    } catch (e) {
      // Storage quota exceeded: keep a lightweight version (drop bulky
      // journey result arrays from older messages, keep the newest one).
      try {
        const trimmed = messages.slice(-10).map((m, i, arr) => (
          (i === arr.length - 1) ? m : { ...m, confirmedResults: undefined, unverifiedResults: undefined }
        ));
        sessionStorage.setItem("railsaathi_chat_messages", JSON.stringify(trimmed));
      } catch (e2) {}
    }
  }, [messages]);

  const scrollToBottom = () => {
    if (chatEndRef.current) {
      chatEndRef.current.scrollIntoView({ behavior: "smooth" });
    }
  };

  useEffect(() => {
    scrollToBottom();
  }, [messages, loading]);

  const handleSend = async (messageText) => {
    const textToSend = (messageText || input).trim();
    if (!textToSend || loading || loadingRef.current) return;
    loadingRef.current = true;

    setInput("");
    setLastError(null);

    const userMsgId = "u_" + Date.now();
    const userMsg = {
      id: userMsgId,
      role: "user",
      text: textToSend,
      timestamp: Date.now(),
    };

    setMessages((prev) => [...prev, userMsg]);
    setLoading(true);

    try {
      const resp = await apiAgentChat(textToSend, sessionId, activeSlots);
      if (resp.session_id) {
        setSessionId(resp.session_id);
      }
      if (resp.slots) {
        setActiveSlots(resp.slots);
      }

      // Check if backend confirmed live provider verification
      const isLiveProvider = Boolean(
        resp.completeness?.is_live ||
        resp.search_results?.some((j) => j.is_live_provider)
      );

      const confirmedJourneys = (resp.search_results || []).map((j) => adaptUnifiedJourney(j, false, isLiveProvider));
      const unverifiedJourneys = (resp.unverified_candidates || []).map((j) => adaptUnifiedJourney(j, true, isLiveProvider));

      // Adopt the chat search into the app-level context so Results,
      // Details and Booking steps work off conversational searches too.
      if (resp.search_triggered || confirmedJourneys.length > 0 || unverifiedJourneys.length > 0) {
        const slots = resp.slots || activeSlots || {};
        const chatQuery = {
          from: (slots.from_station || "").toUpperCase(),
          to: (slots.to_station || "").toUpperCase(),
          date: slots.journey_date || todayISO(),
          travelClass: slots.travel_class || "SL",
          quota: slots.quota || "GN",
          passengers: 1,
          rankingPreference: slots.ranking_preference || "FASTEST",
        };
        // Stamp the search's class + quota on each journey so the journey
        // scope key (journey_id|class|quota) stays unique across re-searches
        // in different classes and Details/Book keep resolving the exact
        // card that was clicked.
        const stamp = (j) => ({ ...j, travelClass: j.travelClass || chatQuery.travelClass, quota: j.quota || chatQuery.quota });
        const stampedConfirmed = confirmedJourneys.map(stamp);
        const stampedUnverified = unverifiedJourneys.map(stamp);
        confirmedJourneys.length = 0; confirmedJourneys.push(...stampedConfirmed);
        unverifiedJourneys.length = 0; unverifiedJourneys.push(...stampedUnverified);
        applyChatSearch(chatQuery, confirmedJourneys, unverifiedJourneys, {
          from: chatQuery.from, to: chatQuery.to, date: chatQuery.date, passengers: 1,
          travelClass: chatQuery.travelClass,
          count: confirmedJourneys.length,
          totalUnverified: unverifiedJourneys.length,
          status: "CHAT_SEARCH",
          isComplete: Boolean(resp.completeness && resp.completeness.complete),
          searchCompleteness: resp.completeness || null,
          at: Date.now(),
          isLiveProvider,
          isDemo: false,
          message: "Results from AI Assistant conversation",
        });
      }

      const assistantMsg = {
        id: "a_" + Date.now(),
        role: "assistant",
        text: resp.assistant_message || resp.reply || "I have processed your request.",
        status: resp.status || resp.state,
        intent: resp.intent,
        slots: resp.slots,
        missingSlots: resp.missing_slots || [],
        ambiguousCandidates: resp.ambiguous_candidates,
        suggestedActions: resp.suggested_actions || [],
        confirmedResults: confirmedJourneys,
        unverifiedResults: unverifiedJourneys,
        completeness: resp.completeness,
        searchTriggered: resp.search_triggered,
        timestamp: Date.now(),
      };

      setMessages((prev) => [...prev, assistantMsg]);
    } catch (err) {
      setLastError({
        message: err.message,
        retry: () => handleSend(textToSend),
      });
      const errorMsg = {
        id: "err_" + Date.now(),
        role: "assistant",
        text: err.message || "Failed to communicate with RailSaathi AI backend.",
        status: "ERROR",
        isError: true,
        canRetry: true,
        retryText: textToSend,
        timestamp: Date.now(),
      };
      setMessages((prev) => [...prev, errorMsg]);
    } finally {
      loadingRef.current = false;
      setLoading(false);
      setTimeout(() => textareaRef.current && textareaRef.current.focus(), 50);
    }
  };

  const resetSession = () => {
    setSessionId(null);
    setActiveSlots(null);
    setLastError(null);
    try { sessionStorage.removeItem("railsaathi_chat_session"); } catch (e) {}
    try { sessionStorage.removeItem("railsaathi_chat_messages"); } catch (e) {}
    try { sessionStorage.removeItem("railsaathi_chat_slots"); } catch (e) {}
    setMessages([
      {
        id: "welcome_" + Date.now(),
        role: "assistant",
        text: "Session reset. Where would you like to travel next?",
        status: "GREETING",
        timestamp: Date.now(),
        suggestedActions: [
          "Find trains from Bengaluru to Chennai tomorrow",
          "Trains from Pune to Mumbai day after tomorrow in 3A",
          "New Delhi to Mumbai CSMT tomorrow",
        ],
      }
    ]);
  };

  const onKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  return (
    <Card className="p-4 sm:p-6 shadow-cardlg border border-navy-100 flex flex-col h-[750px] relative overflow-hidden">
      {/* Session Header */}
      <div className="pb-3 border-b border-navy-100 flex flex-wrap items-center justify-between gap-2">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-electric to-cyanx-500 grid place-items-center text-white shadow-sm">
            <Icon name="sparkles" size={16} />
          </div>
          <div>
            <h3 className="font-display font-bold text-navy-900 text-sm sm:text-base leading-tight flex items-center gap-2">
              RailSaathi AI Assistant
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Connected to FastAPI backend" />
            </h3>
            <p className="text-[11px] text-navy-500">
              Natural language railway journey discovery & confirmation
            </p>
          </div>
        </div>

        <div className="flex items-center gap-2">
          {sessionId && (
            <span className="hidden sm:inline-block font-mono text-[11px] px-2 py-0.5 rounded bg-navy-50 text-navy-500 border border-navy-100">
              ID: {sessionId.slice(0, 8)}...
            </span>
          )}
          <Button variant="ghost" size="sm" onClick={resetSession} className="text-navy-600 hover:text-navy-900 text-xs">
            <Icon name="refresh" size={13} /> New Chat
          </Button>
        </div>
      </div>

      {/* Active Slots & Defaults Banner */}
      <div className="my-2 py-1.5 px-3 rounded-lg bg-navy-50/80 border border-navy-100/70 text-[11px] text-navy-600 flex flex-wrap items-center justify-between gap-1">
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1">
          <span>
            <strong className="text-navy-800">From:</strong> {activeSlots?.from_station || "—"}
          </span>
          <span>
            <strong className="text-navy-800">To:</strong> {activeSlots?.to_station || "—"}
          </span>
          <span>
            <strong className="text-navy-800">Date:</strong> {activeSlots?.journey_date || "—"}
          </span>
          <span className="text-navy-400">|</span>
          <span className="text-navy-500">
            Class: <strong className="text-navy-700">{activeSlots?.travel_class || "SL"}</strong> (Default)
          </span>
          <span className="text-navy-500">
            Quota: <strong className="text-navy-700">{activeSlots?.quota || "GN"}</strong> (Default)
          </span>
          <span className="text-navy-500">
            Rank: <strong className="text-navy-700">{activeSlots?.ranking_preference || "FASTEST"}</strong>
          </span>
        </div>
        <span className="text-[10px] text-navy-400 italic">Say e.g. "in 3A" or "cheapest" to change</span>
      </div>

      {/* Message Thread */}
      <div className="flex-1 overflow-y-auto pr-1 sm:pr-2 space-y-4 my-2 scrollbar-thin">
        {messages.map((m) => {
          if (m.role === "user") {
            return (
              <div key={m.id} className="flex justify-end animate-fadeUp">
                <div className="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm bg-gradient-to-r from-electric to-navy-900 text-white px-4 py-2.5 shadow-sm text-sm">
                  <p className="whitespace-pre-wrap leading-relaxed">{m.text}</p>
                </div>
              </div>
            );
          }

          return (
            <div key={m.id} className="flex gap-2.5 sm:gap-3 items-start animate-fadeUp">
              <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-br from-electric/20 to-cyanx-500/20 text-electric grid place-items-center shrink-0 mt-0.5">

              </div>

function searchFromStation(runSearch, code) {
  const st = getStation(code);
  const dest = st && st.state === "Goa" ? "BGM" : "MAO";
  runSearch({ from: code, to: dest, date: todayISO(), passengers: 1, travelClass: "SL" });
}

function minsBetween(a, b) { const [ah, am] = a.split(":").map(Number); const [bh, bm] = b.split(":").map(Number); let d = (bh * 60 + bm) - (ah * 60 + am); if (d < 0) d += 1440; return d; }

/* ---------- FAQ (/faq) ---------- */
function FAQPage() {
  const groups = [
    { title: "Searching & results", items: [
      ["How does RailRoute AI find journeys when a direct train is full?", "The engine looks beyond a single train. It checks seat availability segment-by-segment across every train, then assembles complete paths from your origin to your destination — allowing a seat change on the same train or a connection between two trains at a shared station. Only journeys where every segment has confirmed availability are shown."],
      ["Why do I see a journey with a 'seat change'?", "A seat change means you stay on the same train but move to a different seat or coach partway through, because the seat you hold isn't available for the full distance. The engine finds another confirmed seat for the remaining segment so you can complete the journey on one ticket-equivalent path."],
      ["What does a 'train change' mean?", "A train change is a connection: you alight at an intermediate station and board a different train that also has confirmed seats for the onward segment. The connection time and station are shown in the journey timeline."],

    ]},
    { title: "Fares & classes", items: [
      ["How are fares calculated?", "Fares use a simple base-plus-per-kilometre model: ₹base + (distance × ₹rate), rounded to the nearest rupee, summed across segments. Real railway fares include reservation fees, tatkal quotas and dynamic pricing that this prototype does not model."],
      ["Which travel classes are supported?", CLASSES.length + " classes: " + CLASSES.map(c => c.label).join(", ") + ". Not every train offers every class — the directory shows which classes each train runs."],

/* ---------- Network insights (/insights) ---------- */
function InsightsPage() {
  const stationCounts = STATIONS.map(s => ({ s, n: trainsAtStation(s.code).length })).sort((a, b) => b.n - a.n);
  const typeCounts = TRAIN_TYPES.reduce((acc, ty) => { acc[ty] = TRAINS.filter(t => t.type === ty).length; return acc; }, {});
  const maxCount = Math.max(...stationCounts.map(x => x.n), 1);
  const stopOccurrences = TRAINS.reduce((a, t) => a + t.stops.length, 0);
  const longest = TRAINS.reduce((m, t) => Math.max(m, maxKmOf(t)), 0);
  // fare-vs-distance series per class
  const dists = [0, 100, 200, 300, 400, 500, 600, 700, 800];
  const series = CLASS_ORDER.map(c => ({ c, pts: dists.map(d => computeFare(c, d)) }));
  const maxFare = Math.max(...series.flatMap(s => s.pts), 1);
  const seriesColors = { "2S": "#64748b", SL: "#10b981", CC: "#0ea5e9", "3A": "#8b5cf6", "2A": "#f59e0b", "1A": "#f43f5e" };
  return (
    <PageShell title="Network insights" breadcrumb={[{ label: "Explore", action: () => navigate("/explore") }]}>
      <p className="text-navy-500 -mt-2 mb-5 max-w-2xl">A data-driven look at the {STATIONS.length}-station, {TRAINS.length}-train corridor. All figures are computed live from the dataset.</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {[["Stations", STATIONS.length, "mapPin"], ["Trains", TRAINS.length, "train"], ["Stop occurrences", stopOccurrences, "route"], ["Longest route", longest + " km", "moon"]].map(([k, v, ic]) => (
          <Card key={k} className="p-5"><div className="flex items-center gap-2 text-navy-400 text-xs uppercase font-semibold"><Icon name={ic} size={14}/> {k}</div><div className="font-display text-2xl font-extrabold text-navy-900 mt-1">{v}</div></Card>
        ))}
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
        <Card className="p-5">
          <h3 className="font-display font-bold text-navy-900 mb-4 flex items-center gap-2"><Icon name="trendingUp" size={18} className="text-electric"/> Busiest stations (trains halting)</h3>
          <div className="space-y-2">
            {stationCounts.slice(0, 10).map(({ s, n }) => (
              <div key={s.code} className="flex items-center gap-3">
                <span className="w-24 text-xs font-semibold text-navy-700 truncate">{s.code} · {s.city}</span>
                <div className="flex-1 h-5 rounded-md bg-navy-50 overflow-hidden"><div className="h-full bg-gradient-to-r from-electric to-cyanx-500" style={{ width: `${(n / maxCount) * 100}%` }} /></div>
                <span className="w-6 text-right text-sm font-bold text-navy-900">{n}</span>
              </div>
            ))}
          </div>
        </Card>
        <Card className="p-5">
          <h3 className="font-display font-bold text-navy-900 mb-4 flex items-center gap-2"><Icon name="train" size={18} className="text-electric"/> Trains by type</h3>
          <div className="flex items-end justify-around h-48 gap-4 pt-4">
            {Object.entries(typeCounts).map(([ty, n]) => { const tm = TRAIN_TYPE_META[ty]; return (
              <div key={ty} className="flex flex-col items-center gap-2 flex-1">
                <div className="text-lg font-extrabold text-navy-900">{n}</div>
                <div className="w-full rounded-t-lg" style={{ height: `${(n / Math.max(...Object.values(typeCounts), 1)) * 120}px`, background: tm.dot }} />
                <div className="text-xs font-semibold text-navy-600">{ty}</div>
              </div>
            );})}
          </div>
        </Card>
      </div>
      <Card className="p-5 mt-5">
        <h3 className="font-display font-bold text-navy-900 mb-1 flex items-center gap-2"><Icon name="ticket" size={18} className="text-electric"/> Fare vs distance by class</h3>
        <p className="text-xs text-navy-400 mb-4">Estimated fare (₹) against distance (km) for each travel class.</p>
        <div className="overflow-x-auto"><svg viewBox="0 0 820 280" className="w-full min-w-[600px] h-64">
          {[0, 0.25, 0.5, 0.75, 1].map((g, i) => <line key={i} x1="50" y1={20 + g * 220} x2="800" y2={20 + g * 220} stroke="#eef2f7" strokeWidth="1" />)}
          {series.map((s) => { const pts = s.pts.map((f, i) => `${50 + (dists[i] / 800) * 750},${240 - (f / maxFare) * 220}`).join(" "); return <polyline key={s.c} points={pts} fill="none" stroke={seriesColors[s.c]} strokeWidth="2.5" />; })}
          {dists.map((d, i) => <text key={i} x={50 + (d / 800) * 750} y="262" textAnchor="middle" fontSize="10" fill="#94a3b8">{d}</text>)}
        </svg></div>
        <div className="flex flex-wrap gap-3 mt-3">{series.map(s => <span key={s.c} className="inline-flex items-center gap-1.5 text-xs font-semibold text-navy-600"><span className="w-3 h-1.5 rounded-full" style={{ background: seriesColors[s.c] }} /> {s.c}</span>)}</div>
      </Card>
    </PageShell>
  );
}

/* ---------- Accessibility (/accessibility) ---------- */
function AccessibilityPage() {
  return (
    <PageShell title="Accessibility" breadcrumb={[{ label: "Explore", action: () => navigate("/explore") }]}>
      <Card className="p-6 max-w-3xl">
        <Badge color="emerald" icon="users" className="mb-2">Accessibility statement</Badge>
        <h2 className="font-display text-xl font-extrabold text-navy-900">Built to be usable by everyone</h2>
        <div className="mt-4 space-y-4 text-sm text-navy-600 leading-relaxed">
          <p>RailRoute AI aims for an accessible experience: semantic HTML structure, keyboard-navigable controls, sufficient colour contrast on the navy-and-cyan palette, and responsive layouts that reflow to a single column on phones. Interactive elements such as the search form, FAQ accordions and station selector can be operated without a mouse.</p>
          <h3 className="font-display font-bold text-navy-900 text-base mt-5">What works</h3>
          <ul className="list-disc pl-5 space-y-1"><li>Keyboard focus on buttons, inputs, selects and links.</li><li>Responsive layouts that avoid horizontal scrolling down to 375px.</li><li>Text sizing that respects browser zoom.</li><li>SVG icons paired with text labels for primary actions.</li></ul>

/* ---------- Booking & confirmation (/booking/:journeyKey-or-rank) ---------- */

  const [seatPref, setSeatPref] = useState("any");
  const [confirmed, setConfirmed] = useState(null);
  useEffect(() => { if (j && !pax) { const n = (search && search.passengers) || 1; setPax(Array.from({ length: n }, () => ({ name: "", age: "" }))); } }, [j, pax, search]);

  if (!j) {
    return <PageShell title="Booking" breadcrumb={[]}>
      <Card className="p-10 text-center">

        <p className="text-navy-500">Pick a journey from the results page to start a booking.</p>

      </Card>

  }

  const from = getStation(j.segments[0].from), to = getStation(j.segments[j.segments.length - 1].to);
  const cs = changeStyle(j.changeType);
  const n = pax ? pax.length : (search && search.passengers) || 1;
  const grandTotal = j.totalFare != null ? j.totalFare * n : null;
  const classLabel = CLASSES.find((c) => c.code === (j.travelClass || (search && search.travelClass))) || CLASSES[0];

  if (confirmed) {
    return (
      <PageShell title="Booking confirmed" breadcrumb={[{ label: "Details", action: () => navigate(`/journey/${journeyRef(j, rank)}`) }]} actions={<Button variant="outline" size="md" onClick={() => navigate("/discover")}><Icon name="arrowLeft" size={15} /> Results</Button>}>
        <div className="mb-4"><StepIndicator current={3} /></div>
        <Card className="p-6 md:p-8 text-center">
          <div className="inline-grid place-items-center w-16 h-16 rounded-2xl bg-emerald-500 text-white mb-3"><Icon name="check" size={32} /></div>
          <h2 className="font-display text-2xl font-extrabold text-navy-900">Your journey is confirmed</h2>

          <div className="mt-4 inline-flex items-center gap-2 rounded-xl bg-navy-50 border border-navy-100 px-4 py-2">
            <span className="text-xs uppercase text-navy-400 font-semibold">PNR</span>
            <span className="font-mono font-extrabold text-electric text-lg tracking-wider">{confirmed.pnr}</span>

        </Card>

            <div className="flex items-center gap-4">
              <div><div className="font-display text-xl font-extrabold text-navy-900">{minTo12(j.departAbs)}</div><div className="text-sm text-navy-500">{from.city} <span className="text-xs text-navy-400 font-mono">{from.code}</span></div></div>
              <div className="flex-1 flex flex-col items-center"><div className="text-xs text-navy-400">{durStr(j.totalDuration)}</div><div className="w-full flex items-center my-1"><span className="w-2 h-2 rounded-full bg-electric" /><span className="flex-1 h-0.5 bg-gradient-to-r from-electric to-cyanx-500 mx-1" /><Icon name="train" size={16} className="text-cyanx-500" /><span className="flex-1 h-0.5 bg-gradient-to-r from-cyanx-500 to-emerald-500 mx-1" /><span className="w-2 h-2 rounded-full bg-emerald-500" /></div><div className="text-[11px] text-navy-500">{fmtDist(j.totalDist)}</div></div>
              <div className="text-right"><div className="font-display text-xl font-extrabold text-navy-900">{minTo12(j.arriveAbs)}<span className="text-xs align-top text-violet-500">{dayOffsetLabel(j.arriveAbs)}</span></div><div className="text-sm text-navy-500">{to.city} <span className="text-xs text-navy-400 font-mono">{to.code}</span></div></div>
            </div>
            <div className="mt-4 pt-4 border-t border-navy-100 grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
              <div><div className="text-xs text-navy-400 uppercase font-semibold">Class</div><div className="font-bold text-navy-900">{classLabel.label}</div></div>
              <div><div className="text-xs text-navy-400 uppercase font-semibold">Passengers</div><div className="font-bold text-navy-900">{n}</div></div>
              <div><div className="text-xs text-navy-400 uppercase font-semibold">Changes</div><div className="font-bold text-navy-900">{j.trainChanges + j.seatChanges}</div></div>
              <div><div className="text-xs text-navy-400 uppercase font-semibold">Total paid</div><div className="font-bold text-navy-900">{fmtFare(grandTotal)}</div></div>
            </div>
          </Card>
          <Card className="p-5">
            <h4 className="font-display font-bold text-navy-900 mb-3">What next?</h4>
            <div className="space-y-2">
              <Button variant="primary" size="md" className="w-full" onClick={() => navigate("/dashboard")}><Icon name="gauge" size={15} /> Go to dashboard</Button>
              <Button variant="outline" size="md" className="w-full" onClick={() => navigate("/discover")}><Icon name="arrowLeft" size={15} /> Back to results</Button>
              <Button variant="outline" size="md" className="w-full" onClick={() => navigate("/search")}><Icon name="search" size={15} /> New search</Button>
            </div>
            <p className="text-xs text-navy-400 mt-3">{AVAILABILITY_SOURCE}.</p>
          </Card>
        </div>
      </PageShell>
    );
  }

  const seatSegs = j.segments.filter((s) => s.seat && s.coach);
  const prefs = [["any", "No preference"], ["window", "Window"], ["aisle", "Aisle"], ["lower", "Lower berth"], ["upper", "Upper berth"]];

  return (
    <PageShell title="Review & book" breadcrumb={[{ label: "Details", action: () => navigate(`/journey/${journeyRef(j, rank)}`) }]} actions={<Button variant="outline" size="md" onClick={() => navigate(`/journey/${journeyRef(j, rank)}`)}><Icon name="arrowLeft" size={15} /> Back to details</Button>}>
      <div className="mb-4"><StepIndicator current={3} /></div>
      <div className="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-6">
        <div className="space-y-5">
          <Card className="p-5">
            <div className="flex flex-wrap items-center gap-2 mb-3">
              <Badge color={cs.color} icon="route">{cs.label}</Badge>
              {j.overnight && <Badge color="violet" icon="moon">Overnight</Badge>}
              {j.isUnverified ? (
                <Badge color="amber" icon="alert">Unverified — Not Confirmed</Badge>
              ) : (
                <Badge color="emerald" icon="shield">All confirmed</Badge>
              )}
            </div>
            {j.isUnverified && (
              <div className="mb-3 rounded-xl bg-amber-50 border border-amber-200 p-3 text-xs text-amber-800 flex items-start gap-2">
                <Icon name="alert" size={15} className="text-amber-600 shrink-0 mt-0.5" />
                <span>One or more segments could not be confirmed available by the railway provider. Booking confirmation is disabled for unverified candidates.</span>
              </div>
            )}
            <div className="flex items-center gap-4">
              <div><div className="font-display text-2xl font-extrabold text-navy-900">{minTo12(j.departAbs)}</div><div className="text-sm text-navy-500">{from.city}</div></div>
              <div className="flex-1 flex flex-col items-center"><div className="text-xs text-navy-400">{durStr(j.totalDuration)}</div><div className="w-full flex items-center my-1"><span className="w-2 h-2 rounded-full bg-electric" /><span className="flex-1 h-0.5 bg-gradient-to-r from-electric to-cyanx-500 mx-1" /><Icon name="train" size={16} className="text-cyanx-500" /><span className="flex-1 h-0.5 bg-gradient-to-r from-cyanx-500 to-emerald-500 mx-1" /><span className="w-2 h-2 rounded-full bg-emerald-500" /></div><div className="text-[11px] text-navy-500">{fmtDist(j.totalDist)}</div></div>
              <div className="text-right"><div className="font-display text-2xl font-extrabold text-navy-900">{minTo12(j.arriveAbs)}<span className="text-xs align-top text-violet-500">{dayOffsetLabel(j.arriveAbs)}</span></div><div className="text-sm text-navy-500">{to.city}</div></div>
            </div>
          </Card>

          <Card className="p-5">
            <h3 className="font-display font-bold text-navy-900 mb-3 flex items-center gap-2"><Icon name="users" size={18} className="text-electric" /> Passenger details ({n})</h3>
            <div className="space-y-3">
              {Array.from({ length: n }).map((_, i) => (
                <div key={i} className="grid grid-cols-[auto_1fr_120px] gap-3 items-center">
                  <span className="grid place-items-center w-8 h-8 rounded-lg bg-navy-50 text-xs font-bold text-navy-600">{i + 1}</span>
                  <input placeholder={`Passenger ${i + 1} name`} value={pax ? (pax[i] && pax[i].name) || "" : ""} onChange={(e) => { const np = (pax || []).slice(); np[i] = { ...(np[i] || { name: "", age: "" }), name: e.target.value }; setPax(np); }} className="rounded-lg border border-navy-100 px-3 py-2 text-sm outline-none focus:border-electric" />
                  <input placeholder="Age" type="number" min="1" max="120" value={pax ? (pax[i] && pax[i].age) || "" : ""} onChange={(e) => { const np = (pax || []).slice(); np[i] = { ...(np[i] || { name: "", age: "" }), age: e.target.value }; setPax(np); }} className="rounded-lg border border-navy-100 px-3 py-2 text-sm outline-none focus:border-electric" />
                </div>
              ))}
            </div>
            <div className="mt-4 pt-4 border-t border-navy-100 grid sm:grid-cols-2 gap-3">
              <input placeholder="Email" type="email" value={contact.email} onChange={(e) => setContact({ ...contact, email: e.target.value })} className="rounded-lg border border-navy-100 px-3 py-2 text-sm outline-none focus:border-electric" />
              <input placeholder="Mobile" value={contact.phone} onChange={(e) => setContact({ ...contact, phone: e.target.value })} className="rounded-lg border border-navy-100 px-3 py-2 text-sm outline-none focus:border-electric" />
            </div>
          </Card>

          <Card className="p-5">
            <h3 className="font-display font-bold text-navy-900 mb-3 flex items-center gap-2"><Icon name="ticket" size={18} className="text-electric" /> Seat preference</h3>
            <div className="flex flex-wrap gap-2">
              {prefs.map(([v, l]) => <button key={v} onClick={() => setSeatPref(v)} className={cx("px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors", seatPref === v ? "bg-electric text-white shadow-glow" : "bg-white border border-navy-100 text-navy-600 hover:border-electric")}>{l}</button>)}
            </div>
            {seatSegs.length > 0 && (
              <div className="mt-4 rounded-xl bg-amber-50 border border-amber-200 p-4">
                <div className="flex items-center gap-2 text-amber-800 font-semibold text-sm"><Icon name="shuffle" size={15} /> This journey involves a seat change</div>
                <p className="text-xs text-amber-700 mt-1">You'll keep your preference where available; the confirmed coach and seat for each segment appear in the fare breakdown below.</p>
              </div>
            )}
          </Card>

          <Card className="p-5">
            <h3 className="font-display font-bold text-navy-900 mb-3 flex items-center gap-2"><Icon name="wallet" size={18} className="text-electric" /> Fare breakdown</h3>
            <div className="overflow-x-auto -mx-2">
              <table className="w-full text-sm min-w-[480px]">
                <thead><tr className="text-left text-xs uppercase text-navy-400 border-b border-navy-100"><th className="py-2 px-2">Segment</th><th className="py-2 px-2">Train</th><th className="py-2 px-2">Seat</th><th className="py-2 px-2 text-right">Fare</th></tr></thead>
                <tbody>
                  {j.segments.map((s, i) => { const sf = getStation(s.from), stt = getStation(s.to); return (
                    <tr key={i} className="border-b border-navy-50"><td className="py-2 px-2 text-navy-700">{sf.city} → {stt.city}</td><td className="py-2 px-2 text-navy-600">{s.trainName}</td><td className="py-2 px-2 font-mono text-navy-600">{s.coach && s.seat ? `${s.coach}-${s.seat}` : "—"}</td><td className="py-2 px-2 text-right font-mono font-bold text-navy-900">{fmtFare(s.fare)}</td></tr>
                  ); })}
                  <tr className="font-bold"><td colSpan={3} className="py-2 px-2 text-right text-navy-700">Per passenger</td><td className="py-2 px-2 text-right font-mono text-navy-900">{fmtFare(j.totalFare)}</td></tr>
                </tbody>
              </table>
            </div>
          </Card>
        </div>

        <aside className="space-y-4">
          <Card className="p-5 lg:sticky lg:top-20">
            <h4 className="font-display font-bold text-navy-900 mb-3">Booking summary</h4>
            <dl className="space-y-2.5 text-sm">
              <div className="flex justify-between"><dt className="text-navy-500">Route</dt><dd className="font-semibold text-navy-900 text-right">{from.city} → {to.city}</dd></div>
              <div className="flex justify-between"><dt className="text-navy-500">Date</dt><dd className="font-semibold text-navy-900">{search ? prettyDate(search.date) : todayISO()}</dd></div>
              <div className="flex justify-between"><dt className="text-navy-500">Class</dt><dd className="font-semibold text-navy-900">{classLabel.label}</dd></div>
              <div className="flex justify-between"><dt className="text-navy-500">Passengers</dt><dd className="font-semibold text-navy-900">{n}</dd></div>
              <div className="flex justify-between"><dt className="text-navy-500">Per passenger</dt><dd className="font-mono font-semibold text-navy-900">{fmtFare(j.totalFare)}</dd></div>
            </dl>
            <div className="mt-4 pt-4 border-t border-navy-100 flex items-end justify-between">
              <span className="text-sm text-navy-500 font-semibold">Total</span>
              <span className="font-display text-2xl font-extrabold text-electric">{fmtFare(grandTotal)}</span>
            </div>
            <Button variant="primary" size="md" disabled={j.isUnverified} className="w-full mt-4" onClick={() => { if (j.isUnverified) return; const pnr = "RR" + Math.random().toString(36).slice(2, 8).toUpperCase(); setConfirmed({ pnr }); window.scrollTo({ top: 0 }); }}><Icon name="check" size={15} /> {j.isUnverified ? "Unavailable (Unverified)" : "Confirm booking"}</Button>
            <p className="text-xs text-navy-400 mt-3 text-center">Demo only — no payment is processed.</p>
          </Card>
        </aside>
      </div>
    </PageShell>
  );
}

    case "search": page = <SearchPage />; break;
    case "discover": page = <ResultsPage />; break;
    case "journey": page = <JourneyDetailsPage />; break;
    case "booking": page = <BookingPage />; break;
    case "ai": page = <AIPage />; break;
    case "compare": page = <ComparePage />; break;
    case "dashboard": page = <DashboardPage />; break;
    case "how-it-works": page = <HowItWorksPage />; break;
    case "about": page = <AboutPage />; break;
    case "signin": page = <SignInPage />; break;
    case "stations": page = <StationsDirectory />; break;
    case "station": page = <StationDetailPage />; break;
    case "trains": page = <TrainsDirectory />; break;
    case "train": page = <TrainDetailPage />; break;
    case "fares": page = <FaresPage />; break;
    case "timetable": page = <TimetablePage />; break;
    case "map": page = <NetworkMapPage />; break;
    case "routes": page = <PopularRoutesPage />; break;
    case "saved": page = <SavedJourneysPage />; break;
    case "history": page = <HistoryPage />; break;
    case "explore": page = <ExplorePage />; break;
    case "faq": page = <FAQPage />; break;
    case "tips": page = <TravelTipsPage />; break;
    case "insights": page = <InsightsPage />; break;
    case "contact": page = <ContactPage />; break;
    case "privacy": page = <PrivacyPage />; break;
    case "terms": page = <TermsPage />; break;

function App() {
  useEffect(() => {
    const boot = document.getElementById("boot");
    if (boot) { const t = setTimeout(() => { boot.classList.add("hide"); setTimeout(() => boot.remove(), 600); }, 350); return () => clearTimeout(t); }
  }, []);
  return <AppProvider><Shell /></AppProvider>;
}
